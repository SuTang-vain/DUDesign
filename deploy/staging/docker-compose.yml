services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dudesign_staging}
      POSTGRES_USER: ${POSTGRES_USER:-dudesign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dudesign_staging_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: ${API_IMAGE_TARGET:-api}
      args:
        INSTALL_PLAYWRIGHT_DEPS: ${INSTALL_PLAYWRIGHT_DEPS:-false}
        APT_MIRROR: ${APT_MIRROR:-}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      DUDESIGN_REPOSITORY: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-dudesign}:${POSTGRES_PASSWORD:-dudesign_staging_password}@postgres:5432/${POSTGRES_DB:-dudesign_staging}
      DUDESIGN_ARTIFACT_ROOT: /app/.dudesign/artifacts
      SMOKE_EVIDENCE_DIR: ${DUDESIGN_STAGING_DYNAMIC_ENCYCLOPEDIA_EVIDENCE_DIR:-}
      DUDESIGN_ARTIFACT_PIXEL_GATE: ${DUDESIGN_ARTIFACT_PIXEL_GATE:-0}
      DUDESIGN_ARTIFACT_PIXEL_GATE_TIMEOUT_MS: ${DUDESIGN_ARTIFACT_PIXEL_GATE_TIMEOUT_MS:-6000}
      DUDESIGN_RUNTIME_PROVIDER: ${DUDESIGN_RUNTIME_PROVIDER:-mock}
      DUDESIGN_RUNTIME_MODE: ${DUDESIGN_RUNTIME_MODE:-}
      BABELO_BASE_URL: ${BABELO_BASE_URL:-http://runtime-adapter:4100}
      BABELO_API_KEY: ${BABELO_API_KEY:-}
      BABELO_AUTH_HEADER: ${BABELO_AUTH_HEADER:-}
      BABELO_TIMEOUT_MS: ${BABELO_TIMEOUT_MS:-}
      BABELO_STREAM_IDLE_TIMEOUT_MS: ${BABELO_STREAM_IDLE_TIMEOUT_MS:-}
      BABELO_STREAM_RECONNECT_ATTEMPTS: ${BABELO_STREAM_RECONNECT_ATTEMPTS:-1}
      BABELO_CONTRACT_VERSION: ${BABELO_CONTRACT_VERSION:-}
      DUDESIGN_RUNTIME_VARIATION_CONCURRENCY: ${DUDESIGN_RUNTIME_VARIATION_CONCURRENCY:-3}
      DUDESIGN_REFINE_RECONCILER_ENABLED: ${DUDESIGN_REFINE_RECONCILER_ENABLED:-true}
      DUDESIGN_REFINE_RECONCILE_INTERVAL_MS: ${DUDESIGN_REFINE_RECONCILE_INTERVAL_MS:-2000}
      DUDESIGN_REFINE_RECONCILE_LEASE_MS: ${DUDESIGN_REFINE_RECONCILE_LEASE_MS:-30000}
      DUDESIGN_REFINE_RECONCILE_BATCH_SIZE: ${DUDESIGN_REFINE_RECONCILE_BATCH_SIZE:-20}
      DUDESIGN_REFINE_RECONCILE_ORPHAN_MS: ${DUDESIGN_REFINE_RECONCILE_ORPHAN_MS:-300000}
      DUDESIGN_GUIDANCE_ANALYSIS_PROVIDER: ${DUDESIGN_GUIDANCE_ANALYSIS_PROVIDER:-legacy}
      DUDESIGN_GUIDANCE_ANALYSIS_ENDPOINT: ${DUDESIGN_GUIDANCE_ANALYSIS_ENDPOINT:-/v1/guidance/analyze}
      DUDESIGN_GUIDANCE_ANALYSIS_TIMEOUT_MS: ${DUDESIGN_GUIDANCE_ANALYSIS_TIMEOUT_MS:-210000}
      DUDESIGN_GUIDANCE_BABELO_BASE_URL: ${DUDESIGN_GUIDANCE_BABELO_BASE_URL:-}
      DUDESIGN_GUIDANCE_BABELO_API_KEY: ${DUDESIGN_GUIDANCE_BABELO_API_KEY:-}
      DUDESIGN_GUIDANCE_BABELO_AUTH_HEADER: ${DUDESIGN_GUIDANCE_BABELO_AUTH_HEADER:-}
      DUDESIGN_CLI_AGENT_EXECUTABLE: ${DUDESIGN_CLI_AGENT_EXECUTABLE:-}
      DUDESIGN_CLI_AGENT_ARGS_JSON: ${DUDESIGN_CLI_AGENT_ARGS_JSON:-[]}
      DUDESIGN_CLI_AGENT_ENV_JSON: ${DUDESIGN_CLI_AGENT_ENV_JSON:-{}}
      DUDESIGN_CLI_AGENT_WORKSPACE_BASE: ${DUDESIGN_CLI_AGENT_WORKSPACE_BASE:-/app/.dudesign/cli-agent-workspaces}
      DUDESIGN_CLI_AGENT_TIMEOUT_MS: ${DUDESIGN_CLI_AGENT_TIMEOUT_MS:-600000}
      DUDESIGN_CLI_AGENT_MAX_OUTPUT_BYTES: ${DUDESIGN_CLI_AGENT_MAX_OUTPUT_BYTES:-1048576}
      DUDESIGN_CLI_AGENT_MAX_ARTIFACT_BYTES: ${DUDESIGN_CLI_AGENT_MAX_ARTIFACT_BYTES:-5242880}
      DUDESIGN_CLI_AGENT_MAX_ARTIFACT_FILES: ${DUDESIGN_CLI_AGENT_MAX_ARTIFACT_FILES:-128}
      DUDESIGN_CLI_AGENT_KILL_GRACE_MS: ${DUDESIGN_CLI_AGENT_KILL_GRACE_MS:-2000}
      DUDESIGN_MCP_EXECUTOR: ${DUDESIGN_MCP_EXECUTOR:-mock}
      DUDESIGN_MCP_BASE_URL: ${DUDESIGN_MCP_BASE_URL:-}
      DUDESIGN_MCP_ENDPOINT_PATH: ${DUDESIGN_MCP_ENDPOINT_PATH:-}
      DUDESIGN_MCP_API_KEY: ${DUDESIGN_MCP_API_KEY:-}
      DUDESIGN_MCP_AUTH_HEADER: ${DUDESIGN_MCP_AUTH_HEADER:-}
      DUDESIGN_MCP_TIMEOUT_MS: ${DUDESIGN_MCP_TIMEOUT_MS:-}
      DUDESIGN_OAUTH_GITHUB_CLIENT_ID: ${DUDESIGN_OAUTH_GITHUB_CLIENT_ID:-}
      DUDESIGN_OAUTH_GITHUB_CLIENT_SECRET: ${DUDESIGN_OAUTH_GITHUB_CLIENT_SECRET:-}
      DUDESIGN_OAUTH_GITHUB_REDIRECT_URI: ${DUDESIGN_OAUTH_GITHUB_REDIRECT_URI:-}
      DUDESIGN_OAUTH_GOOGLE_CLIENT_ID: ${DUDESIGN_OAUTH_GOOGLE_CLIENT_ID:-}
      DUDESIGN_OAUTH_GOOGLE_CLIENT_SECRET: ${DUDESIGN_OAUTH_GOOGLE_CLIENT_SECRET:-}
      DUDESIGN_OAUTH_GOOGLE_REDIRECT_URI: ${DUDESIGN_OAUTH_GOOGLE_REDIRECT_URI:-}
    volumes:
      - artifact-data:/app/.dudesign/artifacts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"

  runtime-adapter:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: runtime-adapter
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4100
      BABELO_NEXUS_BASE_URL: ${BABELO_NEXUS_BASE_URL:-http://babel-o-nexus:3000}
      BABELO_NEXUS_API_KEY: ${BABELO_NEXUS_API_KEY:-dudesign-staging-babelo-key}
      BABELO_NEXUS_AUTH_HEADER: ${BABELO_NEXUS_AUTH_HEADER:-}
      DUDESIGN_RUNTIME_LANE_MODE: ${DUDESIGN_RUNTIME_LANE_MODE:-single}
      DUDESIGN_RUNTIME_LANES_JSON: ${DUDESIGN_RUNTIME_LANES_JSON:-}
      RUNTIME_ADAPTER_STATE_FILE: ${RUNTIME_ADAPTER_STATE_FILE:-/app/.dudesign/runtime-adapter/state.json}
      RUNTIME_ADAPTER_WORKSPACE_BASE: ${RUNTIME_ADAPTER_WORKSPACE_BASE:-/workspace}
      RUNTIME_ADAPTER_EXECUTE_RETRY_ATTEMPTS: ${RUNTIME_ADAPTER_EXECUTE_RETRY_ATTEMPTS:-2}
      RUNTIME_ADAPTER_EXECUTE_RETRY_BASE_DELAY_MS: ${RUNTIME_ADAPTER_EXECUTE_RETRY_BASE_DELAY_MS:-750}
      RUNTIME_ADAPTER_LANE_RETRY_ATTEMPTS: ${RUNTIME_ADAPTER_LANE_RETRY_ATTEMPTS:-2}
      RUNTIME_ADAPTER_LANE_ACQUIRE_TIMEOUT_MS: ${RUNTIME_ADAPTER_LANE_ACQUIRE_TIMEOUT_MS:-30000}
      RUNTIME_ADAPTER_LANE_ACQUIRE_POLL_MS: ${RUNTIME_ADAPTER_LANE_ACQUIRE_POLL_MS:-250}
      RUNTIME_ADAPTER_EXECUTE_TIMEOUT_MS: ${RUNTIME_ADAPTER_EXECUTE_TIMEOUT_MS:-300000}
      RUNTIME_ADAPTER_GUIDANCE_EXECUTE_TIMEOUT_MS: ${RUNTIME_ADAPTER_GUIDANCE_EXECUTE_TIMEOUT_MS:-60000}
      RUNTIME_ADAPTER_GUIDANCE_TIMEOUT_RETRY_ATTEMPTS: ${RUNTIME_ADAPTER_GUIDANCE_TIMEOUT_RETRY_ATTEMPTS:-1}
      RUNTIME_ADAPTER_WATCHDOG_TIMEOUT_MS: ${RUNTIME_ADAPTER_WATCHDOG_TIMEOUT_MS:-600000}
    depends_on:
      babel-o-nexus:
        condition: service_started
    profiles:
      - babel-o
      - babel-o-multilane
    volumes:
      - runtime-adapter-state:/app/.dudesign/runtime-adapter
      - babel-o-workspace:/workspace
      - babel-o-workspace-b:/runtime-workspaces/lane-b
      - babel-o-workspace-c:/runtime-workspaces/lane-c
    ports:
      - "127.0.0.1:${RUNTIME_ADAPTER_PORT:-4100}:4100"

  babel-o-nexus:
    build:
      context: ${BABELO_NEXUS_CONTEXT:-../../BABEL/BabeL-O}
      dockerfile: ${BABELO_NEXUS_DOCKERFILE:-/tmp/dudesign-babelo-nexus.Dockerfile}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXUS_HOST: 0.0.0.0
      NEXUS_PORT: 3000
      NEXUS_API_KEY: ${BABELO_NEXUS_API_KEY:-dudesign-staging-babelo-key}
      BABEL_O_WORKSPACE: /workspace
      NEXUS_STORAGE_PATH: /data/nexus.sqlite
      NEXUS_ALLOWED_TOOLS: ${BABELO_NEXUS_ALLOWED_TOOLS:-Read,ListDir,Glob,Grep,Write,Edit}
      NEXUS_EXECUTE_TIMEOUT_MS: ${BABELO_NEXUS_EXECUTE_TIMEOUT_MS:-600000}
      NEXUS_MAX_CONCURRENT_EXECUTIONS: ${BABELO_NEXUS_MAX_CONCURRENT_EXECUTIONS:-4}
      BABEL_O_CONFIG_FILE: ${BABELO_NEXUS_CONFIG_FILE:-}
    profiles:
      - babel-o
      - babel-o-multilane
    volumes:
      - babel-o-workspace:/workspace
      - babel-o-data:/data
    ports:
      - "127.0.0.1:${BABELO_NEXUS_PORT:-3300}:3000"

  babel-o-nexus-b:
    build:
      context: ${BABELO_NEXUS_CONTEXT:-../../BABEL/BabeL-O}
      dockerfile: ${BABELO_NEXUS_DOCKERFILE:-/tmp/dudesign-babelo-nexus.Dockerfile}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXUS_HOST: 0.0.0.0
      NEXUS_PORT: 3000
      NEXUS_API_KEY: ${BABELO_NEXUS_API_KEY:-dudesign-staging-babelo-key}
      BABEL_O_WORKSPACE: /runtime-workspaces/lane-b
      NEXUS_STORAGE_PATH: /data/nexus.sqlite
      NEXUS_ALLOWED_TOOLS: ${BABELO_NEXUS_ALLOWED_TOOLS:-Read,ListDir,Glob,Grep,Write,Edit}
      NEXUS_EXECUTE_TIMEOUT_MS: ${BABELO_NEXUS_EXECUTE_TIMEOUT_MS:-600000}
      NEXUS_MAX_CONCURRENT_EXECUTIONS: ${BABELO_NEXUS_LANE_MAX_CONCURRENT_EXECUTIONS:-1}
      BABEL_O_CONFIG_FILE: ${BABELO_NEXUS_CONFIG_FILE:-}
    profiles:
      - babel-o-multilane
    volumes:
      - babel-o-workspace-b:/runtime-workspaces/lane-b
      - babel-o-data-b:/data
    ports:
      - "127.0.0.1:${BABELO_NEXUS_B_PORT:-3312}:3000"

  babel-o-nexus-c:
    build:
      context: ${BABELO_NEXUS_CONTEXT:-../../BABEL/BabeL-O}
      dockerfile: ${BABELO_NEXUS_DOCKERFILE:-/tmp/dudesign-babelo-nexus.Dockerfile}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXUS_HOST: 0.0.0.0
      NEXUS_PORT: 3000
      NEXUS_API_KEY: ${BABELO_NEXUS_API_KEY:-dudesign-staging-babelo-key}
      BABEL_O_WORKSPACE: /runtime-workspaces/lane-c
      NEXUS_STORAGE_PATH: /data/nexus.sqlite
      NEXUS_ALLOWED_TOOLS: ${BABELO_NEXUS_ALLOWED_TOOLS:-Read,ListDir,Glob,Grep,Write,Edit}
      NEXUS_EXECUTE_TIMEOUT_MS: ${BABELO_NEXUS_EXECUTE_TIMEOUT_MS:-600000}
      NEXUS_MAX_CONCURRENT_EXECUTIONS: ${BABELO_NEXUS_LANE_MAX_CONCURRENT_EXECUTIONS:-1}
      BABEL_O_CONFIG_FILE: ${BABELO_NEXUS_CONFIG_FILE:-}
    profiles:
      - babel-o-multilane
    volumes:
      - babel-o-workspace-c:/runtime-workspaces/lane-c
      - babel-o-data-c:/data
    ports:
      - "127.0.0.1:${BABELO_NEXUS_C_PORT:-3313}:3000"

  web:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_DUDESIGN_API_URL: ${NEXT_PUBLIC_DUDESIGN_API_URL:-}
        NEXT_PUBLIC_DUDESIGN_WEB_BASE_PATH: ${NEXT_PUBLIC_DUDESIGN_WEB_BASE_PATH:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DUDESIGN_API_URL: ${NEXT_PUBLIC_DUDESIGN_API_URL:-}
      NEXT_PUBLIC_DUDESIGN_WEB_BASE_PATH: ${NEXT_PUBLIC_DUDESIGN_WEB_BASE_PATH:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"

  admin:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: admin
      args:
        NEXT_PUBLIC_DUDESIGN_API_URL: ${NEXT_PUBLIC_DUDESIGN_API_URL:-}
        NEXT_PUBLIC_DUDESIGN_ADMIN_BASE_PATH: ${NEXT_PUBLIC_DUDESIGN_ADMIN_BASE_PATH:-/admin}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DUDESIGN_API_URL: ${NEXT_PUBLIC_DUDESIGN_API_URL:-}
      NEXT_PUBLIC_DUDESIGN_ADMIN_BASE_PATH: ${NEXT_PUBLIC_DUDESIGN_ADMIN_BASE_PATH:-/admin}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3002}:3002"

volumes:
  postgres-data:
  artifact-data:
  runtime-adapter-state:
  babel-o-workspace:
  babel-o-workspace-b:
  babel-o-workspace-c:
  babel-o-data:
  babel-o-data-b:
  babel-o-data-c:
