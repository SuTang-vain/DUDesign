<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>景区路线动态交互卡参考</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; color: #17221f; background: #e8efec; font-family: "PingFang SC", system-ui, sans-serif; }
      button { color: inherit; font: inherit; }
      .frame { width: 788px; height: 492px; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr; gap: 14px; padding: 22px 24px; background: #fff; border: 1px solid #d9e2de; border-radius: 12px; }
      .eyebrow { margin: 0 0 5px; color: #267459; font-size: 11px; font-weight: 700; }
      h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; }
      .summary { margin: 6px 0 0; color: #63716c; font-size: 13px; }
      .tabs { display: flex; gap: 6px; }
      .tab { min-height: 34px; padding: 0 14px; border: 1px solid #d9e2de; border-radius: 6px; background: #f6f9f7; cursor: pointer; }
      .tab[aria-selected="true"] { color: #175d46; border-color: #6ca78f; background: #e9f5ef; font-weight: 700; }
      .content { min-height: 0; display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; }
      .route { min-width: 0; display: grid; grid-template-columns: repeat(4, 1fr); align-items: stretch; gap: 8px; padding: 18px; border: 1px solid #dce5e1; background: #f5f8f6; }
      .stop { position: relative; min-width: 0; padding: 13px 9px; border: 1px solid #d4dfda; border-radius: 7px; background: #fff; text-align: left; cursor: pointer; }
      .stop::after { content: ""; position: absolute; top: 23px; right: -9px; width: 8px; border-top: 2px solid #a9bdb5; }
      .stop:last-child::after { display: none; }
      .stop[aria-pressed="true"] { border-color: #368667; box-shadow: inset 0 0 0 1px #368667; }
      .index { display: grid; place-items: center; width: 25px; height: 25px; color: #fff; background: #368667; border-radius: 50%; font-size: 11px; font-weight: 700; }
      .stop strong { display: block; margin: 9px 0 5px; font-size: 13px; }
      .stop small { color: #77817d; font-size: 10px; line-height: 1.35; }
      .next-stops { display:none; border:1px solid #d4dfda; border-radius:7px; background:#fff; color:#175d46; font-size:10px; font-weight:700; cursor:pointer; }
      .detail { padding: 18px; color: #f5fbf8; background: #1f4f40; border-radius: 7px; }
      .detail-label { color: #a9d4c3; font-size: 10px; font-weight: 700; }
      .detail h2 { margin: 8px 0 7px; font-size: 19px; }
      .detail p { margin: 0; color: #d5e7df; font-size: 12px; line-height: 1.55; }
      .tip { margin-top: 14px; padding: 8px; color: #d8ede5; border: 1px solid #54816f; border-radius: 5px; font-size: 10px; }
      @media (max-width: 420px) {
        .frame { width: 380px; height: 456px; grid-template-rows: auto auto 1fr; gap: 9px; padding: 15px; border-radius: 10px; }
        h1 { font-size: 21px; }
        .summary { max-height: 38px; overflow: hidden; font-size: 12px; line-height: 1.45; }
        .content { grid-template-columns: 1fr; grid-template-rows: 115px 1fr; gap: 8px; }
        .route { padding: 8px; }
        .stop { padding: 8px 6px; }
        .detail { padding: 13px; }
      }
      @media (max-width: 320px), (max-height: 365px) {
        .frame { width: 300px; height: 360px; grid-template-rows: 65px 1fr; gap: 7px; padding: 9px; border-radius: 0; }
        .eyebrow { margin-bottom: 2px; font-size: 9px; }
        h1 { font-size: 17px; }
        .summary { max-height: 18px; margin-top: 3px; font-size: 10px; }
        .tabs { display:none; }
        .content { grid-template-rows: 83px 1fr; gap: 6px; }
        .route { grid-template-columns:repeat(2,1fr) 46px; gap: 4px; padding: 5px; }
        .stop { padding: 6px 4px; }
        .stop::after { top: 18px; right: -5px; width: 4px; }
        .index { width: 21px; height: 21px; font-size: 9px; }
        .stop strong { margin: 5px 0 2px; font-size: 9px; }
        .stop small { display: block; max-height: 22px; overflow: hidden; font-size: 8px; }
        .frame[data-page="1"] .stop:nth-child(n + 3) { display:none; }
        .frame[data-page="2"] .stop:nth-child(-n + 2) { display:none; }
        .next-stops { display:block; min-width:0; padding:4px; }
        .detail { padding: 9px 10px; }
        .detail h2 { margin: 4px 0; font-size: 14px; }
        .detail p { max-height: 35px; overflow: hidden; font-size: 10px; line-height: 1.4; }
        .tip { margin-top: 6px; padding: 4px; font-size: 8px; }
      }
    </style>
  </head>
  <body>
    <main class="frame no-scroll-frame" data-dudesign-template="scenic-route-guide" data-dudesign-core-title="true" data-page="1">
      <header><p class="eyebrow">路线探索</p><h1>【景区主题】</h1><p class="summary">【一句话说明路线适合谁、主要看点与资料边界；未提供时间时不要虚构精确用时。】</p></header>
      <nav class="tabs" role="tablist" aria-label="路线类型"><button class="tab" role="tab" aria-selected="true">核心路线</button><button class="tab" role="tab" aria-selected="false">轻量路线</button><button class="tab" role="tab" aria-selected="false">游览提示</button></nav>
      <section class="content">
        <div class="route" aria-label="游览步骤">
          <button class="stop" aria-pressed="true" data-title="入口与准备" data-copy="【说明入口位置、路线起点和需要确认的开放信息。】"><span class="index">1</span><strong>【入口】</strong><small>确认资料</small></button>
          <button class="stop" aria-pressed="false" data-title="第一核心景点" data-copy="【说明为何先到这里，以及它与下一站的空间关系。】"><span class="index">2</span><strong>【景点甲】</strong><small>核心看点</small></button>
          <button class="stop" aria-pressed="false" data-title="路线转折点" data-copy="【说明分岔、坡度或方向变化；没有可靠信息时明确待确认。】"><span class="index">3</span><strong>【景点乙】</strong><small>方向变化</small></button>
          <button class="stop" aria-pressed="false" data-title="路线终点" data-copy="【说明终点看点、返程或出口提示，不接入虚构票务。】"><span class="index">4</span><strong>【终点】</strong><small>返程提示</small></button>
          <button class="next-stops" type="button">下一段<br><span id="routePage">1/2</span></button>
        </div>
        <article class="detail" aria-live="polite"><span class="detail-label">当前站点</span><h2 id="stopTitle">入口与准备</h2><p id="stopCopy">【说明入口位置、路线起点和需要确认的开放信息。】</p><div class="tip">资料状态：【已提供 / 待确认 / 近似位置】</div></article>
      </section>
    </main>
    <script data-dudesign-example-interaction>
      document.querySelectorAll('.stop').forEach((stop) => stop.addEventListener('click', () => {
        document.querySelectorAll('.stop').forEach((item) => item.setAttribute('aria-pressed', 'false'));
        stop.setAttribute('aria-pressed', 'true');
        document.querySelector('#stopTitle').textContent = stop.dataset.title;
        document.querySelector('#stopCopy').textContent = stop.dataset.copy;
      }));
      document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((item) => item.setAttribute('aria-selected', 'false'));
        tab.setAttribute('aria-selected', 'true');
      }));
      document.querySelector('.next-stops').addEventListener('click', () => {
        const frame = document.querySelector('.frame');
        const nextPage = frame.dataset.page === '1' ? '2' : '1';
        frame.dataset.page = nextPage;
        document.querySelector('.next-stops').firstChild.textContent = nextPage === '1' ? '下一段' : '上一段';
        document.querySelector('#routePage').textContent = `${nextPage}/2`;
      });
    </script>
  </body>
</html>
