<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关系主题动态交互卡参考</title>
  <style>
    :root { --ink:#1e1f24; --muted:#656a76; --line:#dde2ec; --surface:#fff; --soft:#f3f6fb; --blue:#3f6fd8; --green:#22785b; --amber:#9c5b18; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { display:grid; place-items:center; background:#e9edf4; color:var(--ink); font-family:Inter,"PingFang SC",system-ui,sans-serif; }
    button { font:inherit; }
    .pc-card-frame { width:788px; height:492px; display:grid; grid-template-rows:96px 42px 1fr; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .identity { display:grid; grid-template-columns:1fr 190px; gap:20px; padding:18px 24px 14px; border-bottom:1px solid var(--line); }
    .kicker { color:var(--blue); font-size:11px; font-weight:800; }
    h1, h2, p { margin:0; }
    h1 { margin-top:5px; font-size:24px; line-height:1.12; }
    .summary { margin-top:7px; color:var(--muted); font-size:12px; line-height:1.4; }
    .relation-count { align-self:center; padding-left:14px; border-left:3px solid var(--green); }
    .relation-count small { display:block; color:var(--muted); font-size:10px; }
    .relation-count b { display:block; margin-top:5px; font-size:13px; }
    .relation-tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:5px 24px; background:#fafbfc; border-bottom:1px solid var(--line); }
    .relation-tab { min-height:30px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-size:11px; font-weight:800; cursor:pointer; }
    .relation-tab[aria-selected="true"] { background:var(--ink); color:#fff; }
    .relation-workspace { min-height:0; display:grid; grid-template-columns:1fr 310px; gap:18px; padding:20px 24px; background:var(--soft); }
    .node-grid { min-height:0; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-content:center; }
    .relation-node { min-height:70px; padding:9px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--muted); text-align:left; cursor:pointer; }
    .relation-node b, .relation-node span { display:block; }
    .relation-node b { color:var(--ink); font-size:12px; }
    .relation-node span { margin-top:5px; font-size:10px; }
    .relation-node[aria-pressed="true"] { border-color:var(--blue); background:#eaf0ff; color:var(--blue); }
    .relation-node:focus-visible, .relation-tab:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
    .relation-detail { align-self:stretch; padding:18px; border-left:3px solid var(--blue); background:#fff; }
    .relation-type { display:inline-flex; min-height:25px; align-items:center; padding:3px 8px; border-radius:6px; background:#edf8f3; color:var(--green); font-size:10px; font-weight:800; }
    .relation-detail h2 { margin-top:12px; font-size:19px; }
    .relation-detail p { margin-top:9px; color:var(--muted); font-size:12px; line-height:1.55; }
    .source-state { display:block; margin-top:15px; color:var(--amber); font-size:10px; font-weight:700; }
    @media (max-width:500px) {
      .pc-card-frame { width:380px; height:456px; grid-template-rows:88px 42px 1fr; }
      .identity { grid-template-columns:1fr; padding:14px 16px; }
      .relation-count { display:none; }
      .relation-tabs { padding-inline:12px; }
      .relation-workspace { grid-template-columns:1fr; grid-template-rows:108px 1fr; gap:10px; padding:12px; }
      .node-grid { grid-template-columns:repeat(5,1fr); gap:5px; }
      .relation-node { min-height:62px; padding:6px 4px; text-align:center; }
      .relation-node span { display:none; }
      .relation-detail { padding:13px; border-left-width:2px; }
    }
    @media (max-width:320px), (max-height:365px) {
      .pc-card-frame { width:300px; height:360px; grid-template-rows:70px 1fr; border-radius:0; }
      .identity { padding:8px 10px; }
      .kicker { font-size:9px; }
      h1 { margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:17px; }
      .summary { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:3px; font-size:9px; line-height:1.25; }
      .relation-tabs { display:none; }
      .relation-workspace { grid-template-rows:66px 1fr; gap:7px; padding:8px; }
      .node-grid { grid-template-columns:repeat(3,1fr); gap:3px; }
      .relation-node { min-height:54px; padding:4px 2px; border-radius:5px; }
      .relation-node b { font-size:9px; }
      .relation-detail { padding:9px 10px; }
      .relation-type { min-height:22px; padding:2px 6px; font-size:8px; }
      .relation-detail h2 { margin-top:7px; font-size:14px; }
      .relation-detail p { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; margin-top:5px; font-size:9px; line-height:1.32; }
      .source-state { display:none; }
      .relation-node:nth-child(n + 4) { display:none; }
    }
  </style>
</head>
<body>
  <main class="pc-card-frame no-scroll-frame" data-dudesign-template="dtp_dynamic_encyclopedia_relation_card">
    <header class="identity">
      <div><span class="kicker">关系探索</span><h1 data-dudesign-core-title>【词条主题】</h1><p class="summary" data-dudesign-core-summary>【用一句短话说明最关键的关系线索。】</p></div>
      <aside class="relation-count"><small>当前关系组</small><b id="relationGroupLabel">核心角色</b></aside>
    </header>
    <nav class="relation-tabs tab-bar" role="tablist" aria-label="关系类型">
      <button class="relation-tab" type="button" role="tab" aria-selected="true" data-group="核心角色">核心角色</button>
      <button class="relation-tab" type="button" role="tab" aria-selected="false" data-group="协作影响">协作影响</button>
      <button class="relation-tab" type="button" role="tab" aria-selected="false" data-group="对照分歧">对照分歧</button>
    </nav>
    <section class="relation-workspace">
      <div class="node-grid" data-dudesign-control-group aria-label="可探索关系节点">
        <button class="relation-node" type="button" aria-pressed="true" data-member="中心节点"><b>中心节点</b><span>主题本体</span></button>
        <button class="relation-node" type="button" aria-pressed="false" data-member="关键人物"><b>关键人物</b><span>直接推动</span></button>
        <button class="relation-node" type="button" aria-pressed="false" data-member="协作组织"><b>协作组织</b><span>共同参与</span></button>
        <button class="relation-node" type="button" aria-pressed="false" data-member="关联概念"><b>关联概念</b><span>机制联系</span></button>
        <button class="relation-node" type="button" aria-pressed="false" data-member="对照对象"><b>对照对象</b><span>差异理解</span></button>
      </div>
      <article class="relation-detail" id="relationDetail" role="tabpanel" data-dudesign-selected-detail aria-live="polite">
        <span class="relation-type" id="relationType">主题本体</span>
        <h2 id="relationTitle">中心节点</h2>
        <p id="relationSummary">【用不超过两句短话解释当前关系；点击其他节点后在原位替换。】</p>
        <span class="source-state" id="sourceState">证据状态：使用用户资料或明确标注待核实</span>
      </article>
    </section>
  </main>
  <script data-dudesign-example-interaction>
    const relationData = {
      '中心节点': ['主题本体', '【先解释主题本身，再通过节点点击逐步揭示人物、组织、概念与对照关系。】'],
      '关键人物': ['直接推动', '【说明该人物与主题之间可核实的动作、影响与时间范围，不补造动机。】'],
      '协作组织': ['共同参与', '【说明组织承担的角色、协作边界和来源状态。】'],
      '关联概念': ['机制联系', '【用短句解释概念如何影响主题，必要时标注尚待核实。】'],
      '对照对象': ['差异理解', '【指出两者最关键的差异与容易混淆之处，引导用户继续点击探索。】'],
    };
    const nodes = Array.from(document.querySelectorAll('.relation-node'));
    const tabs = Array.from(document.querySelectorAll('.relation-tab'));
    function selectNode(name) {
      const detail = relationData[name];
      document.getElementById('relationType').textContent = detail[0];
      document.getElementById('relationTitle').textContent = name;
      document.getElementById('relationSummary').textContent = detail[1];
      nodes.forEach(function (node) { node.setAttribute('aria-pressed', node.dataset.member === name ? 'true' : 'false'); });
    }
    nodes.forEach(function (node) { node.addEventListener('click', function () { selectNode(node.dataset.member); }); });
    tabs.forEach(function (tab) { tab.addEventListener('click', function () {
      tabs.forEach(function (item) { item.setAttribute('aria-selected', item === tab ? 'true' : 'false'); });
      document.getElementById('relationGroupLabel').textContent = tab.dataset.group;
      document.getElementById('relationType').textContent = tab.dataset.group;
      document.getElementById('relationSummary').textContent = '【根据所选关系组重排节点，并展示该组最关键、可核实的关系说明。】';
    }); });
  </script>
</body>
</html>
