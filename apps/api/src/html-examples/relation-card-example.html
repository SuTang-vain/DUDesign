<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>国色芳华：剧情故事图谱全解析</title>
    <style>
      :root {
        --primary: #6487fa;
        --primary-dark: #4a6ee0;
        --primary-light: #8aa5ff;
        --bg-white: #ffffff;
        --bg-gray: #f8f8f8;
        --text-main: #1e1f24;
        --text-sec: #848691;
        --text-tri: #b7b9c1;
        --border: rgba(0, 0, 0, 0.06);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
        --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.18);
        --gold: #c8a35a;
        --red: #d94b4b;
        --blue: #3b7ad9;
        --green: #4aa06e;
        --pink: #e07aa8;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei",
          sans-serif;
        color: var(--text-main);
        background: #eef1f8;
        user-select: none;
        -webkit-user-select: none;
      }
      button {
        border: none;
        background: none;
        cursor: pointer;
        font-family: inherit;
        color: inherit;
        touch-action: manipulation;
      }
      button:disabled {
        cursor: not-allowed;
      }
      button:focus-visible {
        outline: 3px solid rgba(100, 135, 250, 0.42);
        outline-offset: 3px;
      }
      img {
        display: block;
        -webkit-user-drag: none;
        user-drag: none;
      }

      #app {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: linear-gradient(
          160deg,
          #f5f8ff 0%,
          #eaeff9 60%,
          #dee6f4 100%
        );
        position: relative;
        overflow: hidden;
        container-type: size;
        container-name: app;
      }

      /* ===== 等比缩放画布层（双基准 380×456 / 788×492） ===== */
      html.is-scaled-canvas,
      body.is-scaled-canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eef1f8;
      }
      #app.is-scaled {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: top left;
        /* width / height / transform 由 JS 动态设定 */
      }

      /* ===== 主内容区 ===== */
      .main {
        flex: 1;
        min-height: 0;
        position: relative;
        padding: 12px 14px 4px;
      }
      .view {
        position: absolute;
        inset: 12px 14px 4px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        display: flex;
        flex-direction: column;
      }
      .view.active {
        opacity: 1;
        pointer-events: auto;
      }

      /* ===== 底部 Tab（纯文字） ===== */
      .tabs {
        flex-shrink: 0;
        display: flex;
        gap: 8px;
        padding: 8px 14px 14px;
      }
      .tab-btn {
        flex: 1;
        padding: 12px 4px;
        border-radius: 14px;
        background: #fff;
        backdrop-filter: blur(20px);
        font-size: 15px;
        color: var(--primary-dark);
        font-weight: 800;
        border: 2px solid rgba(100, 135, 250, 0.35);
        box-shadow: 0 4px 12px rgba(100, 135, 250, 0.16);
        transition: all 0.25s ease;
      }
      .tab-btn:hover {
        border-color: var(--primary);
        box-shadow: 0 7px 18px rgba(100, 135, 250, 0.26);
        transform: translateY(-1px);
      }
      .tab-btn.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: #fff;
        border-color: transparent;
        box-shadow: 0 6px 18px rgba(100, 135, 250, 0.44);
      }
      .tab-btn:active {
        transform: scale(0.96);
      }
      .story-switch {
        flex-shrink: 0;
        position: relative;
      }
      .story-bar {
        display: flex;
        gap: 8px;
        padding: 0 2px 8px;
        overflow-x: auto;
        scrollbar-width: none;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
      }
      .story-bar::-webkit-scrollbar {
        display: none;
      }
      .story-btn {
        flex: 0 0 auto;
        min-width: 122px;
        padding: 9px 14px;
        border-radius: 12px;
        background: #fff;
        border: 2px solid rgba(100, 135, 250, 0.28);
        color: var(--primary-dark);
        font-size: 13px;
        font-weight: 800;
        box-shadow: 0 3px 10px rgba(100, 135, 250, 0.14);
        transition: all 0.22s ease;
        scroll-snap-align: start;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .story-index {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 18px;
        height: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: rgba(100, 135, 250, 0.12);
        color: var(--primary-dark);
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
        flex-shrink: 0;
      }
      .story-btn:hover {
        border-color: var(--primary);
        box-shadow: 0 6px 16px rgba(100, 135, 250, 0.24);
        transform: translateY(-1px);
      }
      .story-btn.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: #fff;
        border-color: transparent;
        box-shadow: 0 6px 18px rgba(100, 135, 250, 0.38);
      }
      .story-btn.active .story-index {
        background: rgba(255, 255, 255, 0.24);
        color: #fff;
      }
      .story-btn:active {
        transform: scale(0.97);
      }
      .story-desc {
        width: 100%;
        margin: 0 0 10px;
        padding: 9px 13px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.72);
        border: 1px solid rgba(100, 135, 250, 0.14);
        color: var(--text-main);
        font-size: 13px;
        line-height: 1.55;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        white-space: normal;
      }
      .story-scroll-hint {
        display: none;
      }
      .story-scroll-hint.hide {
        opacity: 0;
        pointer-events: none;
      }
      /* ============================================
         视图 1：故事图谱
         ============================================ */
      .graph-wrap {
        flex: 1;
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 50% 44%,
            rgba(100, 135, 250, 0.07),
            transparent 62%
          ),
          var(--bg-white);
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
        --avatar-size: 64px;
        --avatar-big-size: 78px;
      }
      .graph-wrap.dense-graph {
        --avatar-size: 56px;
        --avatar-big-size: 66px;
      }
      /* 图例：左上角常驻，单行展示，半透明不遮挡 */
      .graph-legend {
        position: absolute;
        top: 12px;
        left: 14px;
        z-index: 30;
        display: flex;
        gap: 14px;
        flex-wrap: nowrap;
        white-space: nowrap;
        font-size: 12px;
        color: var(--text-sec);
        background: rgba(255, 255, 255, 0.82);
        padding: 8px 14px;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        pointer-events: none;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .legend-item.family {
        color: var(--red);
      }
      .legend-item.romance {
        color: var(--pink);
      }
      .legend-item.master {
        color: var(--gold);
      }
      .legend-item.friend {
        color: var(--green);
      }
      .legend-item.enemy {
        color: var(--text-main);
      }
      .lg-svg {
        flex-shrink: 0;
        display: block;
      }
      .lg-svg line {
        stroke-width: 3.2;
      }
      .lg-svg.family line {
        stroke: var(--red);
      }
      .lg-svg.romance line {
        stroke: var(--pink);
        stroke-dasharray: 1.5 5;
        stroke-linecap: round;
      }
      .lg-svg.master line {
        stroke: var(--gold);
        stroke-dasharray: 7 5;
      }
      .lg-svg.friend line {
        stroke: var(--green);
        stroke-dasharray: 14 6;
      }
      .lg-svg.enemy line {
        stroke: var(--text-main);
        stroke-dasharray: 9 4 2 4;
      }

      /* 画布：图谱头像让位时整体压缩到左侧 */
      .graph-canvas {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .graph-wrap.panel-open .graph-canvas {
        right: 380px;
      }
      @container app (max-width: 900px) {
        .graph-wrap.panel-open .graph-canvas {
          right: 320px;
        }
      }
      svg.edges {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
      }
      .edge {
        stroke-width: 2;
        fill: none;
        transition: opacity 0.25s;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .edge.family {
        stroke: var(--red);
        opacity: 0.75;
      }
      .edge.romance {
        stroke: var(--pink);
        stroke-dasharray: 1.5 5;
        stroke-linecap: round;
        opacity: 0.9;
      }
      .edge.master {
        stroke: var(--gold);
        stroke-dasharray: 7 5;
        opacity: 0.8;
      }
      .edge.enemy {
        stroke: var(--text-main);
        stroke-dasharray: 9 4 2 4;
        opacity: 0.45;
      }
      .edge.friend {
        stroke: var(--green);
        stroke-dasharray: 14 6;
        opacity: 0.7;
      }
      .edge.dim {
        opacity: 0.08 !important;
      }
      .edge.hl {
        opacity: 1 !important;
        stroke-width: 3;
      }
      .edge-label {
        font-size: 11px;
        font-weight: 800;
        text-anchor: middle;
        dominant-baseline: central;
        pointer-events: none;
        opacity: 0.95;
        transition: opacity 0.25s;
      }
      .edge-label.family {
        fill: var(--red);
      }
      .edge-label.romance {
        fill: var(--pink);
      }
      .edge-label.master {
        fill: var(--gold);
      }
      .edge-label.friend {
        fill: var(--green);
      }
      .edge-label.enemy {
        fill: var(--text-main);
      }
      .edge-label-bg {
        fill: rgba(255, 255, 255, 0.94);
        stroke: rgba(100, 135, 250, 0.18);
        stroke-width: 1;
        transition: opacity 0.25s;
      }
      .edge-label.dim,
      .edge-label-bg.dim {
        opacity: 0.08 !important;
      }
      .edge-label.hl {
        opacity: 1 !important;
        font-size: 11.5px;
      }
      .edge-label-bg.hl {
        opacity: 1 !important;
        stroke: rgba(100, 135, 250, 0.35);
      }
      .edge-label.lbl-hide,
      .edge-label-bg.lbl-hide {
        opacity: 0 !important;
      }
      .graph-wrap.dense-graph .edge-label {
        font-size: 10px;
      }
      .graph-wrap.dense-graph .edge-label.hl {
        font-size: 10.5px;
      }

      .node {
        position: absolute;
        transform: translate(-50%, -50%);
        cursor: pointer;
        touch-action: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        z-index: 2;
        will-change: left, top;
        transition:
          left 0.5s cubic-bezier(0.4, 0, 0.2, 1),
          top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .avatar.img-fallback,
      .avt.img-fallback,
      .cover.img-fallback {
        background-image: linear-gradient(135deg, #eef1f8, #dfe7f4) !important;
      }
      .node.dragging-now {
        transition: none;
      }
      .node.grabbing {
        cursor: grabbing;
        z-index: 20;
      }
      .node .float-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        will-change: transform;
        animation-name: none;
        animation-duration: 2.4s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }
      .node.grabbing .float-inner {
        animation-play-state: paused;
      }
      @keyframes breathePoint {
        0%, 100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.028);
        }
      }
      /* 头像尺寸收敛：避免节点相互遮挡 */
      .node .avatar {
        width: var(--avatar-size);
        height: var(--avatar-size);
        border-radius: 50%;
        border: 3px solid #fff;
        box-shadow: 0 4px 14px rgba(30, 31, 36, 0.18);
        background-size: cover;
        background-position: center top;
        background-color: #eee;
        position: relative;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        animation: avatarBreath 2.4s ease-out infinite;
      }
      .node .avatar::after {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: inherit;
        border: 2px solid rgba(100, 135, 250, 0.3);
        pointer-events: none;
        animation: avatarPulseRing 2.4s ease-out infinite;
      }
      .node.big .avatar {
        width: var(--avatar-big-size);
        height: var(--avatar-big-size);
        border-width: 4px;
      }
      .node:hover .avatar,
      .node.grabbing .avatar {
        animation: none;
        transform: scale(1.06);
        box-shadow:
          0 0 0 3px rgba(100, 135, 250, 0.16),
          0 6px 18px rgba(30, 31, 36, 0.24);
      }
      .node.active .avatar {
        animation: none;
        box-shadow:
          0 0 0 4px rgba(100, 135, 250, 0.18),
          0 6px 18px rgba(30, 31, 36, 0.24);
      }
      .node:hover .avatar::after,
      .node.grabbing .avatar::after,
      .node.active .avatar::after {
        animation: none;
        opacity: 0;
      }
      .node.dim {
        opacity: 0.32;
      }
      @keyframes avatarBreath {
        0% {
          transform: scale(1);
          box-shadow:
            0 4px 14px rgba(30, 31, 36, 0.18),
            0 0 0 0 rgba(100, 135, 250, 0.42);
        }
        70% {
          transform: scale(1.035);
          box-shadow:
            0 5px 16px rgba(30, 31, 36, 0.2),
            0 0 0 12px rgba(100, 135, 250, 0);
        }
        100% {
          transform: scale(1);
          box-shadow:
            0 4px 14px rgba(30, 31, 36, 0.18),
            0 0 0 0 rgba(100, 135, 250, 0);
        }
      }
      @keyframes avatarPulseRing {
        0% {
          transform: scale(0.94);
          opacity: 0.7;
        }
        70%, 100% {
          transform: scale(1.18);
          opacity: 0;
        }
      }
      .node.tap-hint .avatar {
        animation: tapPulse 1.8s ease-out 3;
      }
      .node.tap-hint .avatar::after {
        animation: avatarPulseRing 1.8s ease-out 3;
      }
      @keyframes tapPulse {
        0%, 100% {
          transform: scale(1);
          box-shadow:
            0 0 0 0 rgba(100, 135, 250, 0.22),
            0 4px 12px rgba(0, 0, 0, 0.16);
        }
        45% {
          transform: scale(1.08);
          box-shadow:
            0 0 0 12px rgba(100, 135, 250, 0),
            0 8px 20px rgba(0, 0, 0, 0.2);
        }
      }

      /* 角色详情：右侧固定面板，不遮挡头像；内容自适应无滚动条 */
      .char-panel {
        position: absolute;
        top: 0;
        right: 0;
        width: 380px;
        height: 100%;
        background: #fff;
        box-shadow: -8px 0 28px rgba(0, 0, 0, 0.12);
        padding: 20px 22px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        transform: translateX(100%);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 25;
        overflow: hidden;
      }
      .graph-wrap.panel-open .char-panel {
        transform: translateX(0);
      }
      @container app (max-width: 900px) {
        .char-panel {
          width: 320px;
        }
      }
      .char-panel .close {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.95);
        font-size: 26px;
        font-weight: 800;
        line-height: 1;
        z-index: 3;
        box-shadow: 0 5px 16px rgba(100, 135, 250, 0.42);
        transition: all 0.2s;
      }
      .char-panel .close:hover {
        background: var(--primary-dark);
        transform: translateY(-1px) scale(1.04);
      }
      .char-panel .close:active {
        transform: scale(0.92);
      }
      .char-panel .char-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-right: 40px;
      }
      .char-panel .avt {
        width: 86px;
        height: 86px;
        border-radius: 18px;
        background-size: cover;
        background-position: center;
        flex: 0 0 auto;
        box-shadow: 0 5px 14px rgba(0, 0, 0, 0.16);
      }
      .char-panel .char-head-info {
        min-width: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
      }
      .char-panel .p-name {
        font-size: 21px;
        font-weight: 800;
        line-height: 1.2;
      }
      .char-panel .p-actor {
        margin-top: 3px;
        font-size: 13px;
        color: var(--text-sec);
      }
      .char-panel .p-section-title {
        display: none;
      }
      .char-panel .char-rel-tag {
        display: inline-block;
        width: fit-content;
        max-width: 100%;
        margin-top: 6px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        padding: 2px 10px;
        border-radius: 20px;
        line-height: 1.4;
        white-space: nowrap;
      }
      .char-panel .p-desc {
        flex: 0 0 auto;
        min-height: 0;
        max-height: none;
        overflow: visible;
        padding: 0;
        border-radius: 0;
        background: transparent;
        border: 0;
        font-size: 14.5px;
        color: var(--text-main);
        line-height: 1.62;
        white-space: normal;
      }
      /* ============================================
         视图 3：作品推荐（合并系列作品 + 相似推荐）
         ============================================ */
      .works-wrap {
        flex: 1;
        background: var(--bg-white);
        border-radius: 16px;
        box-shadow: var(--shadow-sm);
        padding: 14px 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .works-head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        margin-bottom: 12px;
      }
      .works-tabs {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .works-tab {
        padding: 9px 18px;
        border-radius: 22px;
        font-size: 14.5px;
        font-weight: 800;
        background: #fff;
        color: var(--primary-dark);
        border: 2px solid rgba(100, 135, 250, 0.5);
        box-shadow: 0 3px 10px rgba(100, 135, 250, 0.14);
        transition: all 0.2s;
      }
      .works-tab:hover {
        background: rgba(100, 135, 250, 0.08);
        border-color: var(--primary);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(100, 135, 250, 0.24);
      }
      .works-tab.active {
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-light)
        );
        color: #fff;
        border-color: transparent;
        box-shadow: 0 4px 14px rgba(100, 135, 250, 0.45);
      }
      .works-pager {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .works-pageinfo {
        font-size: 13px;
        color: var(--text-sec);
        min-width: 42px;
        text-align: center;
      }
      .works-btn {
        padding: 8px 15px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--primary), var(--primary-light));
        color: #fff;
        border: 2px solid rgba(255, 255, 255, 0.85);
        box-shadow: 0 4px 14px rgba(100, 135, 250, 0.38);
        transition: all 0.2s;
      }
      .works-btn:not(:disabled):hover {
        transform: translateY(-1px);
        box-shadow: 0 7px 18px rgba(100, 135, 250, 0.46);
      }
      .works-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }
      .works-btn:not(:disabled):active {
        transform: scale(0.95);
      }

      .works-viewport {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }
      /* 一行4个，恒定单行，图片尽量铺满窗口 */
      .works-grid {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: 100%;
        grid-auto-flow: column;
        gap: 14px;
      }
      .work-card {
        border-radius: 14px;
        overflow: hidden;
        background: var(--bg-gray);
        display: flex;
        flex-direction: column;
        box-shadow: var(--shadow-sm);
        transition: all 0.25s;
        position: relative;
        min-height: 0;
        cursor: pointer;

    <script>
      /* ========= 数据 ========= */
      const IMG = "./images/";
      const imageCache = new Map();
      function imageUrl(src) {
        return 'url('\${src}')';
      }
      function warmImage(src, onDone) {
        if (!src) {
          onDone(false);
          return;
        }
        if (imageCache.has(src)) {
          onDone(imageCache.get(src));
          return;
        }
        const im = new Image();
        im.onload = () => {
          imageCache.set(src, true);
          onDone(true);
        };
        im.onerror = () => {
          imageCache.set(src, false);
          onDone(false);
        };
        im.src = src;
      }
      function setBgImage(el, src) {
        if (!el) return;
        el.dataset.bgSrc = src || "";
        el.classList.remove("img-fallback");
        el.style.backgroundImage = src ? imageUrl(src) : "";
        warmImage(src, (ok) => {
          if (el.dataset.bgSrc !== src) return;
          if (ok) return;
          el.style.backgroundImage = "";
          el.classList.add("img-fallback");
        });
      }

        const cost = (order) => {
          const pos = {};
          order.forEach((name, i) => (pos[name] = i));
          let score = 0;
          rel.forEach((l) => {
            const i = pos[l.a];
            const j = pos[l.b];
            const d = Math.min(Math.abs(i - j), n - Math.abs(i - j));
            score += Math.max(0, d - 1) * 2;
          });
          for (let x = 0; x < rel.length; x++) {
            for (let y = x + 1; y < rel.length; y++) {
              const a = pos[rel[x].a],
                b = pos[rel[x].b],
                c = pos[rel[y].a],
                d = pos[rel[y].b];
              if (a === c || a === d || b === c || b === d) continue;
              if (between(c, a, b) !== between(d, a, b)) score += 3;
            }
          }
          return score;
        };
        let best = names.slice(),
          bestCost = Infinity;
        const first = names[0];
        const rest = names.slice(1);
        const permute = (arr, k) => {
          if (k === arr.length) {
            const order = [first, ...arr];
            const c = cost(order);
            if (c < bestCost) {
              bestCost = c;
              best = order.slice();
            }
            return;
          }
          for (let i = k; i < arr.length; i++) {
            [arr[k], arr[i]] = [arr[i], arr[k]];
            permute(arr, k + 1);
            [arr[k], arr[i]] = [arr[i], arr[k]];
          }
        };
        permute(rest, 0);
        return best;
      }

      function graphAvatarMetrics(denseGraph) {
        // 按 #app 容器逻辑尺寸判断挡位，与 @container app 断点一致
        const wI = currentBase.w;
        const hI = currentBase.h;
        if (wI <= 400 && hI <= 420) {
          return { av: denseGraph ? 34 : 38, avBig: denseGraph ? 42 : 48, nameF: 9.5 };
        }
        if (wI <= 400) {
          return { av: denseGraph ? 36 : 40, avBig: denseGraph ? 44 : 50, nameF: 10 };
        }
        if (wI <= 768) {
          return { av: denseGraph ? 40 : 46, avBig: denseGraph ? 48 : 56, nameF: 11 };
        }
        if (wI <= 900) {
          return { av: denseGraph ? 52 : 58, avBig: denseGraph ? 62 : 70, nameF: 12 };
        }
        return { av: denseGraph ? 56 : 64, avBig: denseGraph ? 66 : 78, nameF: 12 };
      }

      /* 根据当前画布尺寸计算像素坐标：中心 + 环形，外扩到边缘并迭代分离 */
      function computeLayout() {
        measure();
        const isMobile = isSmallCanvas();
        const denseGraph =
          activeStory.chars.length >= 7 || bounds.w < 560 || bounds.h < 380;
        graphWrap.classList.toggle("dense-graph", denseGraph);
        const { av, avBig, nameF } = graphAvatarMetrics(denseGraph);
        const w = Math.max(bounds.w, isMobile ? 200 : 320);
        const h = Math.max(bounds.h, isMobile ? 200 : 320);
        const topSafe = isMobile ? 48 : 42;
        const botSafe = isMobile ? 22 : 32;
        const usableH = Math.max(h - topSafe - botSafe, 120);
        const cx = w * 0.5;
        const cy = topSafe + usableH * 0.5;
        const layout = {};
        const core = activeStory.chars.includes(HERO) ? HERO : activeStory.chars[0];
        layout[core] = [cx, cy];
        const others = activeStory.chars.filter((k) => k !== core);
        const ringLinks = activeStory.edges.filter(
          (e) => e.a !== core && e.b !== core,
        );
        const ordered = orderRing(others, ringLinks);
        const n = ordered.length;
        const rx = Math.max(w * 0.5 - (isMobile ? 38 : 66), 90);
        const ry = Math.max(usableH * 0.5 - (isMobile ? 10 : 14), 70);
        const start = -Math.PI / 2 + (n % 2 === 0 ? Math.PI / Math.max(n, 1) : 0);
        ordered.forEach((k, i) => {
          const a = start + (i / Math.max(n, 1)) * Math.PI * 2;
          layout[k] = [cx + Math.cos(a) * rx, cy + Math.sin(a) * ry];
        });

        const ext = {};
        Object.keys(layout).forEach((k) => {
          const c = getStoryChar(k);
          const aw = c.big ? avBig : av;
          const nameW = c.name.length * nameF * 0.95 + 14;
          const chipH = isMobile ? 0 : nameF + 4;
          ext[k] = [Math.max(aw, nameW) / 2, (aw + nameF + chipH + 14) / 2];
        });
        const keys = Object.keys(layout);
        let legendClearY = 0;
        const legendEl = document.querySelector(".graph-legend");
        if (legendEl && getComputedStyle(legendEl).display !== "none") {
          const lr = legendEl.getBoundingClientRect();
          const cr = graphCanvas.getBoundingClientRect();
          const S = scaleFactor || 1;
          // 缩放后差值需除以 S，回到画布逻辑坐标系
          legendClearY = Math.max(0, (lr.bottom - cr.top) / S) + 8;
        }
        const clamp = (k) => {
          layout[k][0] = Math.max(
            ext[k][0] + 4,
            Math.min(w - ext[k][0] - 4, layout[k][0]),
          );
          const yMin = Math.max(ext[k][1] + 4, legendClearY + ext[k][1]);
          layout[k][1] = Math.max(
            yMin,
            Math.min(h - ext[k][1] - botSafe, layout[k][1]),
          );
        };
        const marginX = isMobile ? 12 : 18;
        const marginY = isMobile ? 20 : 26;
        for (let it = 0; it < 120; it++) {
          let moved = false;
          for (let i = 0; i < keys.length; i++) {
            for (let j = i + 1; j < keys.length; j++) {
              const a = keys[i],
                b = keys[j];
              const dx = layout[b][0] - layout[a][0];
              const dy = layout[b][1] - layout[a][1];
              const ox = ext[a][0] + ext[b][0] + marginX - Math.abs(dx);
              const oy = ext[a][1] + ext[b][1] + marginY - Math.abs(dy);
              if (ox > 0 && oy > 0) {
                moved = true;
                if (ox <= oy) {
                  const s = dx === 0 ? (i % 2 ? 1 : -1) : Math.sign(dx);
                  layout[a][0] -= (ox / 2) * s;
                  layout[b][0] += (ox / 2) * s;
                } else {
                  const s = dy === 0 ? (i % 2 ? 1 : -1) : Math.sign(dy);
                  layout[a][1] -= (oy / 2) * s;
                  layout[b][1] += (oy / 2) * s;
                }
                clamp(a);
                clamp(b);
              }
            }
          }
          if (!moved) break;
        }
        keys.forEach(clamp);
        return layout;
      }

      function buildGraph() {
        graphCanvas.querySelectorAll(".node").forEach((n) => n.remove());
        Object.keys(nodeState).forEach((k) => delete nodeState[k]);
        graphEdges.innerHTML = "";
        const layout = computeLayout();

        activeStory.chars.forEach((k) => {
          const c = getStoryChar(k);
          const pos = layout[k];
          if (!pos) return;
          const [x, y] = pos;
          const el = document.createElement("div");
          el.className = "node" + (c.big ? " big" : "");
          el.dataset.key = k;
          el.innerHTML = '
            <div class="float-inner">
              <div class="avatar" data-bg-src="\${c.img}" style="background-image:\${imageUrl(c.img)}"></div>
              <div class="name">\${c.name}</div>
            </div>';
          const inner = el.querySelector(".float-inner");
          const dur = 6 + Math.random() * 4;
          inner.style.animationDuration = dur + "s";
          inner.style.animationDelay = -Math.random() * dur + "s";
          el.style.left = x + "px";
          el.style.top = y + "px";
          graphCanvas.appendChild(el);
          setBgImage(el.querySelector(".avatar"), c.img);
          nodeState[k] = { x, y, el, inner };
          attachDrag(el, k);
          el.addEventListener("click", () => {
            if (!el.dataset.dragged) showChar(k);
            delete el.dataset.dragged;
          });
        });

        edges.forEach((e, idx) => {
          const path = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path",
          );
          path.setAttribute("class", "edge " + e.type);
          path.dataset.a = e.a;
          path.dataset.b = e.b;
          path.dataset.idx = String(idx);
          graphEdges.appendChild(path);
        });
        edges.forEach((e, idx) => {
          const bg = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect",
          );
          bg.setAttribute("class", "edge-label-bg");
          bg.setAttribute("rx", "5");
          bg.dataset.a = e.a;
          bg.dataset.b = e.b;
          bg.dataset.idx = String(idx);
          graphEdges.appendChild(bg);

          const label = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text",
          );
          label.setAttribute("class", "edge-label " + e.type);
          label.textContent = e.label;
          label.dataset.a = e.a;
          label.dataset.b = e.b;
          label.dataset.idx = String(idx);
          graphEdges.appendChild(label);
        });
        updateEdgesFromDOM();
      }

      /* 重新布局（面板开合时头像让位移动，带过渡动画） */
      function relayout() {
        const layout = computeLayout();
        Object.entries(layout).forEach(([k, [x, y]]) => {
          const s = nodeState[k];
          if (!s) return;
          s.x = x;
          s.y = y;
          s.el.style.left = x + "px";
          s.el.style.top = y + "px";
        });
        requestAnimationFrame(updateEdgesFromDOM);
      }

      /* 连线端点收缩到头像边缘；直线标签动态避让头像、姓名与其他标签 */
      function updateEdgesFromDOM() {
        const cr = graphCanvas.getBoundingClientRect();
        const S = scaleFactor || 1;
        const edgeEls = Array.from(graphEdges.querySelectorAll(".edge"));
        const labelEls = Array.from(graphEdges.querySelectorAll(".edge-label"));
        const nodeRects = [];
        const avatarCircles = [];
        Object.entries(nodeState).forEach(([key, s]) => {
          const r = s.el.getBoundingClientRect();
          const pad = isSmallCanvas() ? 5 : 8;
          nodeRects.push({
            key,
            left: (r.left - cr.left) / S - pad,
            right: (r.right - cr.left) / S + pad,
            top: (r.top - cr.top) / S - pad,
            bottom: (r.bottom - cr.top) / S + pad,
          });
          const ar = s.el.querySelector(".avatar").getBoundingClientRect();
          avatarCircles.push({
            key,
            x: (ar.left + ar.width / 2 - cr.left) / S,
            y: (ar.top + ar.height / 2 - cr.top) / S,
            r: ar.width / (2 * S) + (s.el.classList.contains("big") ? 12 : 5),
          });
        });
        const pointInRect = (x, y, r) =>
          x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
        const rectsOverlap = (a, b) =>
          a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
        const rectCircleOverlap = (rect, c) => {
          const x = Math.max(rect.left, Math.min(c.x, rect.right));
          const y = Math.max(rect.top, Math.min(c.y, rect.bottom));
          return Math.hypot(x - c.x, y - c.y) < c.r;
        };
        const linePoint = (d, t) => ({
          x: d.x1 + (d.x2 - d.x1) * t,
          y: d.y1 + (d.y2 - d.y1) * t,
        });
        const pathHitsRect = (d, rect) => {
          for (let i = 3; i < 18; i++) {
            const p = linePoint(d, i / 20);
            if (pointInRect(p.x, p.y, rect)) return true;
          }
          return false;
        };
        const clampLabelRect = (rect) => {
          const crW = cr.width / S;
          const crH = cr.height / S;
          const dx = rect.left < 4 ? 4 - rect.left : rect.right > crW - 4 ? crW - 4 - rect.right : 0;
          const dy = rect.top < 4 ? 4 - rect.top : rect.bottom > crH - 4 ? crH - 4 - rect.bottom : 0;
          rect.left += dx;
          rect.right += dx;
          rect.top += dy;
          rect.bottom += dy;
          rect.x += dx;
          rect.y += dy;
          return rect;
        };

        const routeSlots = [];
        const routeSamples = [];
        const edgeData = edgeEls.map((path) => {
          const A = nodeState[path.dataset.a];
          const B = nodeState[path.dataset.b];
          if (!A || !B) return null;
          const target = (nodeEl) => nodeEl.querySelector(".avatar") || nodeEl;
          const ar = target(A.el).getBoundingClientRect();
          const br = target(B.el).getBoundingClientRect();
          const ax = (ar.left + ar.width / 2 - cr.left) / S;
          const ay = (ar.top + ar.height / 2 - cr.top) / S;
          const bx = (br.left + br.width / 2 - cr.left) / S;
          const by = (br.top + br.height / 2 - cr.top) / S;
          const dx = bx - ax;
          const dy = by - ay;
          const dist = Math.hypot(dx, dy) || 1;
          const ux = dx / dist;
          const uy = dy / dist;
          const nx = -uy;
          const ny = ux;
          const idx = Number(path.dataset.idx || 0);
          const terminalShift = ((idx % 5) - 2) * (isSmallCanvas() ? 1.2 : 2);
          const x1 = ax + ux * (ar.width / (2 * S) + 5) + nx * terminalShift;
          const y1 = ay + uy * (ar.height / (2 * S) + 5) + ny * terminalShift;
          const x2 = bx - ux * (br.width / (2 * S) + 5) + nx * terminalShift;
          const y2 = by - uy * (br.height / (2 * S) + 5) + ny * terminalShift;
          const data = {
            x1,
            y1,
            x2,
            y2,
            cx: (x1 + x2) / 2,
            cy: (y1 + y2) / 2,
            nx,
            ny,
            idx,
          };
          routeSlots.push({ x: data.cx, y: data.cy });
          routeSamples.push(Array.from({ length: 13 }, (_, i) => linePoint(data, (i + 4) / 20)));
          path.setAttribute("d", 'M \${x1} \${y1} L \${x2} \${y2}');
          return { path, ...data };
        }).filter(Boolean);

        const labelRects = [];
        labelEls.forEach((label) => {
          const idx = Number(label.dataset.idx || 0);
          const d = edgeData.find((e) => e.idx === idx);
          if (!d) return;
          const text = label.textContent || "";
          const font = currentBase.w <= 400 ? 9.5 : isSmallCanvas() ? 10.5 : 12;
          const w = Math.min(Math.max(text.length * font * 0.78 + 16, 34), isSmallCanvas() ? 72 : 92);
          const h = font * 1.7 + 8;
          const candidates = [
            { t: 0.5, off: 0 },
            { t: 0.42, off: 18 },
            { t: 0.58, off: -18 },
            { t: 0.46, off: -34 },
            { t: 0.54, off: 34 },
            { t: 0.34, off: 28 },
            { t: 0.66, off: -28 },
            { t: 0.3, off: -42 },
            { t: 0.7, off: 42 },
          ];
          let best = null;
          candidates.forEach((c) => {
            const p = linePoint(d, c.t);
            const x = p.x + d.nx * c.off;
            const y = p.y + d.ny * c.off;
            const rect = clampLabelRect({ x, y, left: x - w / 2, right: x + w / 2, top: y - h / 2, bottom: y + h / 2 });
            let score = Math.abs(c.t - 0.5) * 20 + Math.abs(c.off) * 0.2;
            nodeRects.forEach((r) => {
              if (rectsOverlap(rect, r)) score += 1000;
            });
            avatarCircles.forEach((c) => {
              if (rectCircleOverlap(rect, c)) score += 1200;
            });
            labelRects.forEach((r) => {
              if (rectsOverlap(rect, r)) score += 700;
            });
            if (!best || score < best.score) best = { ...rect, score };
          });
          const bg = graphEdges.querySelector('.edge-label-bg[data-idx="\${idx}"]');
          if (!best || best.score >= 1000) {
            label.classList.add("lbl-hide");
            if (bg) bg.classList.add("lbl-hide");
            return;
          }
          label.classList.remove("lbl-hide");
          if (bg) bg.classList.remove("lbl-hide");
          labelRects.push(best);
          label.setAttribute("x", best.x);
          label.setAttribute("y", best.y);
          if (bg) {
            bg.setAttribute("x", best.left);
            bg.setAttribute("y", best.top);
            bg.setAttribute("width", best.right - best.left);
            bg.setAttribute("height", best.bottom - best.top);
          }
        });
      }

      /* 拖拽 */
      function attachDrag(el, key) {
        let startX = 0,
          startY = 0,
          origX = 0,
          origY = 0,
          moved = false;
        const state = () => nodeState[key];
        function onDown(clientX, clientY) {
          moved = false;
          startX = clientX;
          startY = clientY;
          origX = state().x;
          origY = state().y;
          el.classList.add("grabbing", "dragging-now");
          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onUp);
          document.addEventListener("touchmove", onTouchMove, {
            passive: false,
          });
          document.addEventListener("touchend", onUp);
        }
        function onMove(clientX, clientY) {
          // 外层 transform:scale(S) 后，clientX/Y 位移在视觉像素空间；
          // 内部坐标（el.style.left/top、state.x/y）是画布逻辑坐标 —— 增量需除以 S 还原
          const S = scaleFactor || 1;
          const dx = (clientX - startX) / S,
            dy = (clientY - startY) / S;
          if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
          let nx = Math.max(40, Math.min(bounds.w - 40, origX + dx));
          let ny = Math.max(40, Math.min(bounds.h - 40, origY + dy));
          state().x = nx;
          state().y = ny;
          el.style.left = nx + "px";
          el.style.top = ny + "px";
          updateEdgesFromDOM();
        }
        function onUp() {
          el.classList.remove("grabbing", "dragging-now");
          if (moved) el.dataset.dragged = "1";
          document.removeEventListener("mousemove", onMouseMove);
          document.removeEventListener("mouseup", onUp);
          document.removeEventListener("touchmove", onTouchMove);
          document.removeEventListener("touchend", onUp);
        }
        const onMouseMove = (e) => onMove(e.clientX, e.clientY);
        const onTouchMove = (e) => {
          e.preventDefault();
          const t = e.touches[0];
          onMove(t.clientX, t.clientY);
        };
        el.addEventListener("mousedown", (e) => {
          e.preventDefault();
          onDown(e.clientX, e.clientY);
        });
        el.addEventListener(
          "touchstart",
          (e) => {
            const t = e.touches[0];
            onDown(t.clientX, t.clientY);
          },
          { passive: true },
        );
      }

      /* 摆动 + 连线跟随 */
      let reqId = null;
      function edgeSyncLoop() {
        updateEdgesFromDOM();
        reqId = requestAnimationFrame(edgeSyncLoop);
      }
      function startPhysics() {
        document
          .querySelectorAll(".float-inner")
          .forEach((n) => (n.style.animationPlayState = "running"));
        if (!reqId) reqId = requestAnimationFrame(edgeSyncLoop);
      }
      function stopPhysics() {
        document
          .querySelectorAll(".float-inner")
          .forEach((n) => (n.style.animationPlayState = "paused"));
        if (reqId) {
          cancelAnimationFrame(reqId);
          reqId = null;
        }
      }

      /* 右侧角色面板 */
      function highlightRelated(k) {
        const related = new Set([k]);
        edges.forEach((e) => {
          if (e.a === k) related.add(e.b);
          if (e.b === k) related.add(e.a);
        });
        Object.entries(nodeState).forEach(([key, s]) => {
          s.el.classList.toggle("active", key === k);
          s.el.classList.toggle("dim", !related.has(key));
        });
        Array.from(graphEdges.children).forEach((el) => {
          const on = el.dataset.a === k || el.dataset.b === k;
          el.classList.toggle("hl", on);
          el.classList.toggle("dim", !on);
        });
      }
      function clearHighlight() {
        Object.values(nodeState).forEach((s) =>
          s.el.classList.remove("active", "dim"),
        );
        Array.from(graphEdges.children).forEach((line) =>
          line.classList.remove("hl", "dim"),
        );
      }

      function getCharDescText(c) {
        const fullText =
          c.desc && c.desc !== c.storyDesc
            ? '\${c.storyDesc} \${c.desc}'
            : c.storyDesc;
        return fullText.replace(/\s+/g, " ").trim();
      }
      function fitCharPanel() {
        if (!isSmallCanvas() || !graphWrap.classList.contains("panel-open")) return;
        const fitClasses = ["fit-compact", "fit-tight", "fit-ultra"];
        charPanel.classList.remove(...fitClasses);
        charPanel.style.removeProperty("--char-fit-scale");
        for (const cls of fitClasses) {
          if (charPanel.scrollHeight <= charPanel.clientHeight) return;
          charPanel.classList.add(cls);
        }
        let scale = 1;
        for (let i = 0; i < 8 && charPanel.scrollHeight > charPanel.clientHeight; i++) {
          scale = Math.max(0.62, scale * (charPanel.clientHeight / charPanel.scrollHeight));
          charPanel.style.setProperty("--char-fit-scale", String(scale));
        }
      }
      function showChar(k) {
        const c = getStoryChar(k);
        if (!c) return;
        currentCharKey = k;
        setBgImage(document.getElementById("cAvt"), c.img);
        document.getElementById("cName").textContent = c.name;
        document.getElementById("cActor").textContent = c.actor;
        document.getElementById("cDesc").textContent = getCharDescText(c);
        const tagEl = document.getElementById("cRelTag");
        const coreKey = activeStory.chars.includes(HERO)
          ? HERO
          : activeStory.chars[0];
        const coreName = chars[coreKey]?.name || "主角";
        if (k === coreKey) {
          tagEl.textContent = "核心人物 · 本人";
          tagEl.style.background =
            "linear-gradient(135deg, var(--primary), #7b96f7)";
        } else {
          const edgeToCore = edges.find(
            (e) =>
              (e.a === k && e.b === coreKey) || (e.b === k && e.a === coreKey),
          );
          if (edgeToCore) {
            tagEl.textContent =
              "与" + coreName + "：" + (edgeToCore.label || RELN[edgeToCore.type]);
            tagEl.style.background = REL_COLORS[edgeToCore.type];
          } else if (c.storyRel.length) {
            tagEl.textContent = c.storyRel[0];
            tagEl.style.background =
              "linear-gradient(135deg, var(--primary), #7b96f7)";
          } else {
            tagEl.textContent = "本模块人物";
            tagEl.style.background =
              "linear-gradient(135deg, var(--primary), #7b96f7)";
          }
        }

        graphWrap.classList.add("panel-open");
        highlightRelated(k);
        requestAnimationFrame(fitCharPanel);
        // 画布让位后重新测量并重排头像（带过渡）
        setTimeout(() => {
          relayout();
          fitCharPanel();
        }, 60);
      }
      function closeChar() {
        currentCharKey = null;
        charPanel.classList.remove("fit-compact", "fit-tight", "fit-ultra");
        charPanel.style.removeProperty("--char-fit-scale");
        graphWrap.classList.remove("panel-open");
        clearHighlight();
        setTimeout(() => {
          relayout();
        }, 60);
      }
      document.getElementById("charClose").addEventListener("click", closeChar);
      /* =========================================================
         视图 3：作品推荐 —— 4 tab + 每页4个 + 翻页
         ========================================================= */
      const worksGrid = document.getElementById("worksGrid");
      const worksPageInfo = document.getElementById("worksPageInfo");
      const worksPrev = document.getElementById("worksPrev");
      const worksNext = document.getElementById("worksNext");
      const worksScrollHint = document.getElementById("worksScrollHint");
      const worksTabs = document.getElementById("worksTabs");
      const worksCats = Object.keys(WORKS_TAB_LABELS).filter(
        (k) => Array.isArray(works[k]) && works[k].length > 0,
      );
      let worksCat = worksCats[0] || "";
      let worksPage = 0;
      const WORKS_PER_PAGE = 4;

      function renderWorksTabs() {
        if (!worksTabs) return;
        worksTabs.innerHTML = worksCats
          .map(
            (k) =>
              '<button class="works-tab\${k === worksCat ? " active" : ""}" data-cat="\${k}" type="button">\${WORKS_TAB_LABELS[k]}</button>',
          )
          .join("");
        worksTabs.querySelectorAll(".works-tab").forEach((t) => {
          t.addEventListener("click", () => {
            worksTabs
              .querySelectorAll(".works-tab")
              .forEach((x) => x.classList.remove("active"));
            t.classList.add("active");
            worksCat = t.dataset.cat;
            worksPage = 0;
            renderWorks();
          });
        });
      }

      function renderWorks() {
        const list = works[worksCat] || [];
        const pageCount = Math.max(1, Math.ceil(list.length / WORKS_PER_PAGE));
        worksPage = Math.min(worksPage, pageCount - 1);
        worksGrid.dataset.cat = worksCat;
        const items = list.slice(
          worksPage * WORKS_PER_PAGE,
          worksPage * WORKS_PER_PAGE + WORKS_PER_PAGE,
        );
        worksGrid.innerHTML = items
          .map(
            (w) => '
            <div class="work-card \${w.up ? "upcoming" : ""}">
              <div class="cover" data-bg-src="\${IMG}\${w.cover}" style="background-image:\${imageUrl(IMG + w.cover)}">
                \${w.ep ? '<div class="tag">\${w.ep}</div>' : ""}
              </div>
              <div class="info">
                <div class="n">\${w.n}</div>
                <div class="m">\${w.m
                  .split("/")
                  .slice(0, 2)
                  .map((s) => s.trim())
                  .join(" / ")}</div>
                <div class="r">▸ \${w.r}</div>
              </div>
            </div>',
          )
          .join("");
        worksPageInfo.textContent = '\${worksPage + 1}/\${pageCount}';
        const showPager = pageCount > 1;
        worksPrev.classList.toggle("hidden", !showPager);
        worksNext.classList.toggle("hidden", !showPager);
        worksPageInfo.classList.toggle("hidden", !showPager);
        worksPrev.disabled = worksPage === 0;
        worksNext.disabled = worksPage === pageCount - 1;
        worksGrid.querySelectorAll("[data-bg-src]").forEach((el) => {
          setBgImage(el, el.dataset.bgSrc);
        });
        // 重置横向滚动并按是否有右侧内容更新提示箭头（移动端）
        worksGrid.scrollLeft = 0;
        requestAnimationFrame(updateWorksHint);
      }
      worksPrev.addEventListener("click", () => {
        worksPage--;
        renderWorks();
      });
      worksNext.addEventListener("click", () => {
        worksPage++;
        renderWorks();
      });
      // 更新向右提示箭头：右侧仍有内容时显示，已滚动到最右端则隐藏
      function updateWorksHint() {
        if (!worksScrollHint) return;
        const canScrollRight =
          worksGrid.scrollLeft + worksGrid.clientWidth <
          worksGrid.scrollWidth - 4;
        worksScrollHint.classList.toggle("hide", !canScrollRight);
      }
      // 滚动时实时更新箭头显隐
      worksGrid.addEventListener("scroll", updateWorksHint, { passive: true });
      function updateStoryHint() {
        if (!storyScrollHint) return;
        const canScrollRight =
          storyBar.scrollLeft + storyBar.clientWidth < storyBar.scrollWidth - 4;
        storyScrollHint.classList.toggle("hide", !canScrollRight);
      }
      function scrollActiveStoryButton(behavior = "smooth") {
        if (!isSmallCanvas()) return;
        const btns = Array.from(storyBar.querySelectorAll(".story-btn"));
        const activeIndex = btns.findIndex((btn) => btn.dataset.story === currentStoryKey);
        const activeBtn = btns[activeIndex];
        if (!activeBtn) return;
        const nextBtn = btns[Math.min(activeIndex + 1, btns.length - 1)] || activeBtn;
        const targetLeft = Math.max(
          0,
          Math.min(
            storyBar.scrollWidth - storyBar.clientWidth,
            nextBtn.offsetLeft + nextBtn.offsetWidth - storyBar.clientWidth,
          ),
        );
        storyBar.scrollTo({ left: targetLeft, behavior });
      }
      storyBar.addEventListener("scroll", updateStoryHint, { passive: true });
      if (storyScrollHint) {
        storyScrollHint.addEventListener("click", () => {
          storyBar.scrollBy({
            left: storyBar.clientWidth * 0.7,
            behavior: "smooth",
          });
        });
      }
      // 点击向右提示箭头：平滑向右滚动半个窗口宽度
      if (worksScrollHint) {
        worksScrollHint.addEventListener("click", () => {
          worksGrid.scrollBy({
            left: worksGrid.clientWidth / 2,
            behavior: "smooth",
          });
        });
      }
      function getStoryDescText(story) {
        return story.desc || "";
      }
      function renderStoryButtons() {
        storyDesc.textContent = getStoryDescText(activeStory);
        storyBar.innerHTML = storyModules
          .map(
            (s, idx) =>
              '<button class="story-btn \${s.key === currentStoryKey ? "active" : ""}" data-story="\${s.key}"><span class="story-index">\${idx + 1}</span><span>\${s.name}</span></button>',
          )
          .join("");
        storyBar.querySelectorAll(".story-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const next = btn.dataset.story;
            if (!next || next === currentStoryKey) return;
            currentStoryKey = next;
            activeStory = storyByKey[currentStoryKey];
            edges = activeStory.edges;
            currentCharKey = null;
            charPanel.classList.remove("fit-compact", "fit-tight", "fit-ultra");
            charPanel.style.removeProperty("--char-fit-scale");
            graphWrap.classList.remove("panel-open");
            clearHighlight();
            renderStoryButtons();
            requestAnimationFrame(() => scrollActiveStoryButton());
            buildGraph();
          });
        });
        requestAnimationFrame(() => {
          scrollActiveStoryButton("auto");
          updateStoryHint();
        });
      }

      renderStoryButtons();
      renderWorksTabs();

      /* =========================================================
         Tab 切换
         ========================================================= */
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const target = btn.dataset.tab;
          document
            .querySelectorAll(".tab-btn")
            .forEach((b) => b.classList.toggle("active", b === btn));
          document
            .querySelectorAll(".view")
            .forEach((v) =>
              v.classList.toggle("active", v.dataset.view === target),
            );
          if (target === "graph") {
            measure();
            relayout();
            startPhysics();
          } else {
            stopPhysics();
          }
        });
      });

      /* resize 防抖：缩放同步执行，内部重排 debounce */
      let rzT;
      window.addEventListener("resize", () => {
        applyScale();
        clearTimeout(rzT);
        rzT = setTimeout(() => {
          buildGraph();
          if (graphWrap.classList.contains("panel-open")) {
            relayout();
            const c = currentCharKey ? getStoryChar(currentCharKey) : null;
            if (c) document.getElementById("cDesc").textContent = getCharDescText(c);
            fitCharPanel();
          }
          renderWorks();
          storyDesc.textContent = getStoryDescText(activeStory);
          updateStoryHint();
        }, 150);
      });

      /* 初始化 */
      window.addEventListener("load", () => {
        buildGraph();
        renderWorks();
        updateStoryHint();
        startPhysics();
        // 预热全部图片：角色头像 + 剧情封面 + 作品封面，避免切换视图时首次加载闪烁
        const preload = new Set();
        Object.values(chars).forEach((c) => preload.add(c.img));
        Object.values(works)
          .flat()
          .forEach((w) => w.cover && preload.add(IMG + w.cover));
        preload.forEach((src) => warmImage(src, () => {}));
        // 首次进入：主角头像脉冲提示"可点击"，播放结束后移除
        const heroNode = nodeState[HERO] && nodeState[HERO].el;
        if (heroNode) {
          heroNode.classList.add("tap-hint");
          setTimeout(() => heroNode.classList.remove("tap-hint"), 5600);
        }
      });
    </script>
  </body>
</html>
