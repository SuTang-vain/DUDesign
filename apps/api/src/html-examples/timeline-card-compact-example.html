<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时间线主题动态交互卡参考</title>
  <style>
    :root { --ink:#1e1f24; --muted:#666a76; --line:#dfe3ec; --surface:#fff; --soft:#f3f6fb; --blue:#3f6fd8; --green:#20825d; --amber:#a45d16; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { display:grid; place-items:center; background:#e9edf4; color:var(--ink); font-family:Inter,"PingFang SC",system-ui,sans-serif; }
    button { font:inherit; }
    .pc-card-frame { width:788px; height:492px; display:grid; grid-template-rows:104px 1fr 82px; overflow:hidden; border:1px solid var(--line); border-radius:8px; background:var(--surface); }
    .identity { display:grid; grid-template-columns:1fr 176px; gap:20px; padding:20px 24px 16px; border-bottom:1px solid var(--line); }
    .kicker { color:var(--blue); font-size:11px; font-weight:800; }
    h1, h2, p { margin:0; }
    h1 { margin-top:5px; font-size:25px; line-height:1.12; }
    .summary { margin-top:7px; color:var(--muted); font-size:12px; line-height:1.45; }
    .phase-note { align-self:center; padding-left:14px; border-left:3px solid var(--blue); }
    .phase-note small { display:block; color:var(--muted); font-size:10px; }
    .phase-note b { display:block; margin-top:5px; font-size:13px; }
    .stage { min-height:0; display:grid; grid-template-columns:160px 1fr; gap:22px; padding:24px; background:var(--soft); }
    .stage-date { display:flex; flex-direction:column; justify-content:center; border-right:1px solid var(--line); }
    .stage-date strong { color:var(--blue); font-size:30px; line-height:1; }
    .stage-date span { margin-top:8px; color:var(--muted); font-size:11px; }
    .stage-copy { min-width:0; align-self:center; }
    .stage-copy h2 { font-size:20px; line-height:1.2; }
    .stage-copy p { margin-top:10px; max-width:480px; color:var(--muted); font-size:13px; line-height:1.55; }
    .stage-signal { display:inline-flex; align-items:center; min-height:26px; margin-top:14px; padding:4px 9px; border:1px solid #bfd8ce; border-radius:6px; background:#edf8f3; color:var(--green); font-size:10px; font-weight:800; }
    .event-btns { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; padding:12px 18px 14px; border-top:1px solid var(--line); }
    .event-btn { min-width:0; min-height:52px; padding:6px 8px; border:1px solid var(--line); border-radius:7px; background:#fff; color:var(--muted); cursor:pointer; }
    .event-btn span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .event-btn .event-name { color:var(--ink); font-size:11px; font-weight:800; }
    .event-btn .event-year { margin-top:4px; font-size:9px; }
    .event-btn[aria-selected="true"] { border-color:var(--blue); background:#eaf0ff; color:var(--blue); }
    .event-btn:focus-visible { outline:2px solid var(--amber); outline-offset:1px; }
    @media (max-width:500px) {
      .pc-card-frame { width:380px; height:456px; grid-template-rows:92px 1fr 82px; }
      .identity { grid-template-columns:1fr; padding:15px 16px; }
      .phase-note { display:none; }
      .stage { grid-template-columns:92px 1fr; gap:14px; padding:18px 16px; }
      .stage-date strong { font-size:24px; }
      .event-btns { gap:5px; padding:10px 10px 12px; }
      .event-btn { padding-inline:4px; }
    }
    @media (max-width:320px), (max-height:365px) {
      .pc-card-frame { width:300px; height:360px; grid-template-rows:72px 1fr 72px; border-radius:0; }
      .identity { padding:9px 11px; }
      .kicker { font-size:9px; }
      h1 { margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:17px; }
      .summary { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:4px; font-size:9px; line-height:1.25; }
      .stage { grid-template-columns:62px 1fr; gap:10px; padding:12px 11px; }
      .stage-date strong { font-size:18px; }
      .stage-date span { margin-top:5px; font-size:8px; }
      .stage-copy h2 { font-size:15px; }
      .stage-copy p { display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; margin-top:6px; font-size:10px; line-height:1.35; }
      .stage-signal { min-height:24px; margin-top:8px; padding:3px 6px; font-size:8px; }
      .event-btns { gap:3px; padding:8px 6px 9px; }
      .event-btn { min-height:50px; padding:4px 2px; border-radius:5px; }
      .event-btn:nth-child(4), .event-btn:nth-child(5) { display:none; }
      .event-btn .event-name { font-size:9px; }
      .event-btn .event-year { font-size:8px; }
    }
  </style>
</head>
<body>
  <main class="pc-card-frame no-scroll-frame" data-dudesign-template="dtp_dynamic_encyclopedia_timeline_card">
    <header class="identity">
      <div><span class="kicker">阶段时间线</span><h1 data-dudesign-core-title>【词条主题】</h1><p class="summary">【用一句话说明这条时间线为何值得探索，只保留理解阶段变化所需的核心背景。】</p></div>
      <aside class="phase-note"><small>当前查看</small><b id="phaseLabel">奠定基础</b></aside>
    </header>
    <section class="stage" id="eventIntro" role="tabpanel" aria-live="polite">
      <div class="stage-date"><strong id="stageYear">阶段一</strong><span id="stagePeriod">起点与背景</span></div>
      <div class="stage-copy"><h2 id="stageTitle">奠定基础</h2><p id="stageSummary">【说明最早阶段的关键动作、参与者与可核实影响；没有准确日期时使用阶段名称。】</p><span class="stage-signal" id="stageSignal">核心变化：建立初始路径</span></div>
    </section>
    <nav class="event-btns page-switcher" role="tablist" aria-label="时间线阶段">
      <button class="event-btn" type="button" role="tab" aria-selected="true" aria-controls="eventIntro" data-i="0"><span class="event-name">起点</span><span class="event-year">阶段一</span></button>
      <button class="event-btn" type="button" role="tab" aria-selected="false" aria-controls="eventIntro" data-i="1"><span class="event-name">形成</span><span class="event-year">阶段二</span></button>
      <button class="event-btn" type="button" role="tab" aria-selected="false" aria-controls="eventIntro" data-i="2"><span class="event-name">转折</span><span class="event-year">阶段三</span></button>
      <button class="event-btn" type="button" role="tab" aria-selected="false" aria-controls="eventIntro" data-i="3"><span class="event-name">扩展</span><span class="event-year">阶段四</span></button>
      <button class="event-btn" type="button" role="tab" aria-selected="false" aria-controls="eventIntro" data-i="4"><span class="event-name">当下</span><span class="event-year">阶段五</span></button>
    </nav>
  </main>
  <script data-dudesign-example-interaction>
    const stages = [
      { year:'阶段一', period:'起点与背景', title:'奠定基础', summary:'【说明最早阶段的关键动作、参与者与可核实影响；没有准确日期时使用阶段名称。】', signal:'核心变化：建立初始路径' },
      { year:'阶段二', period:'结构形成', title:'关键机制成形', summary:'【说明哪些机制、作品或组织关系在这一阶段稳定下来，以及证据来源状态。】', signal:'核心变化：形成可识别结构' },
      { year:'阶段三', period:'重要转折', title:'寿春失利后的转向', summary:'【用明确因果说明转折如何改变后续路径，避免虚构精确日期或未经证实的动机。】', signal:'核心变化：路径发生调整' },
      { year:'阶段四', period:'影响扩展', title:'从局部走向更广范围', summary:'【说明影响如何扩展到新的参与者、地区、作品或应用场景。】', signal:'核心变化：影响范围扩大' },
      { year:'阶段五', period:'当前状态', title:'当下与开放问题', summary:'【保留当前最关键的状态、边界与仍待核实的问题，引导继续探索。】', signal:'核心变化：进入持续演进' },
    ];
    const buttons = Array.from(document.querySelectorAll('.event-btn'));
    function selectStage(index) {
      const stage = stages[index];
      document.getElementById('stageYear').textContent = stage.year;
      document.getElementById('stagePeriod').textContent = stage.period;
      document.getElementById('stageTitle').textContent = stage.title;
      document.getElementById('stageSummary').textContent = stage.summary;
      document.getElementById('stageSignal').textContent = stage.signal;
      document.getElementById('phaseLabel').textContent = stage.title;
      buttons.forEach(function (button, buttonIndex) { button.setAttribute('aria-selected', buttonIndex === index ? 'true' : 'false'); });
    }
    buttons.forEach(function (button) { button.addEventListener('click', function () { selectStage(Number(button.dataset.i)); }); });
  </script>
</body>
</html>
