<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>系列作品导航动态交互卡参考</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; color: #1e1f24; background: #eef1f6; font-family: "PingFang SC", system-ui, sans-serif; }
      button { color: inherit; font: inherit; }
      .frame { width: 788px; height: 492px; overflow: hidden; position: relative; display: grid; grid-template-rows: auto auto 1fr auto; gap: 13px; padding: 22px 24px 18px; background: #fff; border: 1px solid #dfe3eb; border-radius: 12px; }
      .eyebrow { margin: 0 0 5px; color: #5475df; font-size: 11px; font-weight: 700; }
      h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; }
      .summary { max-width: 620px; margin: 6px 0 0; color: #626672; font-size: 13px; line-height: 1.45; }
      .tabs { display: flex; gap: 6px; }
      .tab { min-height: 34px; padding: 0 13px; border: 1px solid #dfe3eb; border-radius: 6px; background: #f8f9fb; cursor: pointer; }
      .tab[aria-selected="true"] { color: #3156cc; border-color: #8aa1ef; background: #eef3ff; font-weight: 700; }
      .stage { min-height: 0; display: grid; grid-template-columns: 1.25fr .75fr; gap: 15px; }
      .track { min-width: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; gap: 8px; padding: 18px; border: 1px solid #e4e7ee; background: #f8f9fb; }
      .work { min-width: 0; min-height: 112px; padding: 12px 9px; border: 1px solid #d9dee8; border-radius: 6px; background: #fff; text-align: left; cursor: pointer; }
      .work[aria-pressed="true"] { border-color: #6487fa; box-shadow: inset 0 0 0 1px #6487fa; }
      .relation { display: block; color: #6487fa; font-size: 10px; font-weight: 700; }
      .work strong { display: block; margin: 7px 0 4px; font-size: 14px; line-height: 1.25; }
      .work small { color: #777c88; font-size: 11px; }
      .detail { min-width: 0; padding: 17px; color: #fff; background: #202633; border-radius: 7px; }
      .detail-label { color: #aebceb; font-size: 11px; font-weight: 700; }
      .detail h2 { margin: 8px 0 7px; font-size: 18px; line-height: 1.2; }
      .detail p { margin: 0; color: #d8dce5; font-size: 12px; line-height: 1.55; }
      .reason { display: inline-block; margin-top: 13px; padding: 5px 8px; color: #b9c7f7; border: 1px solid #4d5977; border-radius: 5px; font-size: 10px; }
      .footer { display: flex; align-items: center; justify-content: space-between; color: #8a8e98; font-size: 10px; }
      .pager { display: flex; gap: 5px; }
      .next-page { display:none; min-width:58px; height:24px; padding:0 7px; border:1px solid #d7dce6; border-radius:5px; background:#fff; cursor:pointer; }
      @media (max-width: 420px) {
        .frame { width: 380px; height: 456px; grid-template-rows: auto auto 1fr auto; gap: 9px; padding: 15px; border-radius: 10px; }
        h1 { font-size: 21px; }
        .summary { max-height: 38px; overflow: hidden; font-size: 12px; }
        .stage { grid-template-columns: 1fr; grid-template-rows: 116px 1fr; gap: 8px; }
        .track { padding: 8px; }
        .work { min-height: 90px; padding: 9px 7px; }
        .work strong { font-size: 12px; }
        .detail { padding: 12px; }
      }
      @media (max-width: 320px), (max-height: 365px) {
        .frame { width: 300px; height: 360px; grid-template-rows: 64px 1fr 26px; gap: 7px; padding: 9px; border-radius: 0; }
        .eyebrow { margin-bottom: 2px; font-size: 9px; }
        h1 { font-size: 17px; }
        .summary { max-height: 18px; margin-top: 3px; font-size: 10px; line-height: 1.4; }
        .tabs { display:none; }
        .stage { grid-template-rows: 83px 1fr; gap: 6px; }
        .track { gap: 4px; padding: 5px; }
        .work { min-height: 69px; padding: 6px 4px; }
        .frame[data-page="1"] .work:nth-child(n + 3) { display:none; }
        .frame[data-page="2"] .work:nth-child(-n + 2) { display:none; }
        .relation { font-size: 8px; }
        .work strong { margin: 4px 0 2px; font-size: 10px; }
        .work small { font-size: 8px; }
        .detail { padding: 9px 10px; }
        .detail h2 { margin: 4px 0; font-size: 14px; }
        .detail p { max-height: 35px; overflow: hidden; font-size: 10px; line-height: 1.4; }
        .reason { margin-top: 6px; padding: 3px 5px; font-size: 8px; }
        .footer { font-size: 8px; }
        .pager { display:flex; align-items:center; gap:6px; }
        .next-page { display:block; font-size:9px; }
      }
    </style>
  </head>
  <body>
    <main class="frame no-scroll-frame" data-dudesign-template="series-navigation" data-dudesign-core-title="true" data-page="1">
      <header>
        <p class="eyebrow">系列作品导航</p>
        <h1>【当前作品主题】</h1>
        <p class="summary">【一句话说明当前作品在系列、同题材或同创作者作品中的位置，不虚构作品关系。】</p>
      </header>
      <nav class="tabs" role="tablist" aria-label="发现维度">
        <button class="tab" role="tab" aria-selected="true" data-group="系列脉络">系列脉络</button>
        <button class="tab" role="tab" aria-selected="false" data-group="同题材">同题材</button>
        <button class="tab" role="tab" aria-selected="false" data-group="同主创">同主创</button>
      </nav>
      <section class="stage">
        <div class="track" aria-label="作品关系轨道">
          <button class="work" aria-pressed="false" data-title="【相关作品甲】" data-copy="【说明它与当前主题的前传、续集、同系列或版本关系。】"><span class="relation">前置关系</span><strong>【作品甲】</strong><small>【年份/状态】</small></button>
          <button class="work" aria-pressed="true" data-title="【当前作品主题】" data-copy="【说明当前作品的核心定位，以及为何它是这条探索路径的中心。】"><span class="relation">当前作品</span><strong>【主题】</strong><small>【年份/状态】</small></button>
          <button class="work" aria-pressed="false" data-title="【相关作品乙】" data-copy="【说明可核实的续作、衍生或同 IP 关系。】"><span class="relation">后续关系</span><strong>【作品乙】</strong><small>【年份/状态】</small></button>
          <button class="work" aria-pressed="false" data-title="【相关作品丙】" data-copy="【说明推荐理由；若只有相似题材，不要冒充系列成员。】"><span class="relation">相似发现</span><strong>【作品丙】</strong><small>【关系依据】</small></button>
        </div>
        <article class="detail" aria-live="polite">
          <span class="detail-label" id="groupLabel">系列脉络 · 当前查看</span>
          <h2 id="workTitle">【当前作品主题】</h2>
          <p id="workCopy">【说明当前作品的核心定位，以及为何它是这条探索路径的中心。】</p>
          <span class="reason">关系依据：使用已提供资料</span>
        </article>
      </section>
      <footer class="footer"><span>选择作品查看关系说明</span><span class="pager"><span id="pageLabel">1/2</span><button class="next-page" type="button">下一组</button></span></footer>
    </main>
    <script data-dudesign-example-interaction>
      const works = document.querySelectorAll('.work');
      works.forEach((work) => work.addEventListener('click', () => {
        works.forEach((item) => item.setAttribute('aria-pressed', 'false'));
        work.setAttribute('aria-pressed', 'true');
        document.querySelector('#workTitle').textContent = work.dataset.title;
        document.querySelector('#workCopy').textContent = work.dataset.copy;
      }));
      document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((item) => item.setAttribute('aria-selected', 'false'));
        tab.setAttribute('aria-selected', 'true');
        document.querySelector('#groupLabel').textContent = `${tab.dataset.group} · 当前查看`;
      }));
      document.querySelector('.next-page').addEventListener('click', () => {
        const frame = document.querySelector('.frame');
        const nextPage = frame.dataset.page === '1' ? '2' : '1';
        frame.dataset.page = nextPage;
        document.querySelector('#pageLabel').textContent = `${nextPage}/2`;
        document.querySelector('.next-page').textContent = nextPage === '1' ? '下一组' : '上一组';
      });
    </script>
  </body>
</html>
