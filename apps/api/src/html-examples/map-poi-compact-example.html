<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>景区 POI 地图动态交互卡参考</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; color: #17201e; background: #e8efec; font-family: "PingFang SC", system-ui, sans-serif; }
      button { color: inherit; font: inherit; }
      .frame { width: 788px; height: 492px; overflow: hidden; display: grid; grid-template-rows: auto auto 1fr; gap: 13px; padding: 22px 24px; background: #fff; border: 1px solid #d9e2de; border-radius: 12px; }
      .eyebrow { margin: 0 0 5px; color: #28735a; font-size: 11px; font-weight: 700; }
      h1 { margin: 0; font-size: 25px; line-height: 1.15; letter-spacing: 0; }
      .summary { margin: 6px 0 0; color: #66716d; font-size: 13px; }
      .tabs { display: flex; gap: 6px; }
      .tab { min-height: 34px; padding: 0 14px; border: 1px solid #d8e1dd; border-radius: 6px; background: #f6f9f7; cursor: pointer; }
      .tab[aria-selected="true"] { color: #185f47; border-color: #6ca78f; background: #e8f5ef; font-weight: 700; }
      .content { min-height: 0; display: grid; grid-template-columns: 1.35fr .65fr; gap: 14px; }
      .map { min-width: 0; position: relative; overflow: hidden; border: 1px solid #d9e4df; background: linear-gradient(155deg, #edf4f0 0 49%, #e3ece7 49% 52%, #f5f8f6 52%); }
      .map::before, .map::after { content: ""; position: absolute; background: #c4d7cf; border-radius: 999px; transform: rotate(-20deg); }
      .map::before { width: 390px; height: 6px; left: 20px; top: 125px; }
      .map::after { width: 260px; height: 5px; left: 120px; top: 210px; transform: rotate(28deg); }
      .poi { position: absolute; z-index: 1; min-width: 74px; min-height: 34px; padding: 6px 8px; border: 1px solid #8bb8a6; border-radius: 6px; background: #fff; text-align: left; cursor: pointer; }
      .poi[aria-pressed="true"] { color: #fff; border-color: #247257; background: #247257; }
      .poi small { display: block; opacity: .72; font-size: 8px; }
      .poi:nth-of-type(1) { left: 10%; top: 16%; }
      .poi:nth-of-type(2) { left: 42%; top: 28%; }
      .poi:nth-of-type(3) { left: 68%; top: 12%; }
      .poi:nth-of-type(4) { left: 23%; top: 64%; }
      .poi:nth-of-type(5) { left: 62%; top: 67%; }
      .more-pois { display:none; }
      .detail { padding: 18px; color: #f3faf7; background: #204f40; border-radius: 7px; }
      .detail-label { color: #acd6c5; font-size: 10px; font-weight: 700; }
      .detail h2 { margin: 8px 0 7px; font-size: 19px; }
      .detail p { margin: 0; color: #d6e8e0; font-size: 12px; line-height: 1.55; }
      .status { margin-top: 14px; padding: 7px; color: #d8ede5; border: 1px solid #54816f; border-radius: 5px; font-size: 10px; }
      @media (max-width: 420px) {
        .frame { width: 380px; height: 456px; grid-template-rows: auto auto 1fr; gap: 9px; padding: 15px; border-radius: 10px; }
        h1 { font-size: 21px; }
        .summary { max-height: 38px; overflow: hidden; font-size: 12px; line-height: 1.45; }
        .content { grid-template-columns: 1fr; grid-template-rows: 190px 1fr; gap: 8px; }
        .detail { padding: 12px; }
      }
      @media (max-width: 320px), (max-height: 365px) {
        .frame { width: 300px; height: 360px; grid-template-rows: 64px 1fr; gap: 7px; padding: 9px; border-radius: 0; }
        .eyebrow { margin-bottom: 2px; font-size: 9px; }
        h1 { font-size: 17px; }
        .summary { max-height: 18px; margin-top: 3px; font-size: 10px; }
        .tabs { display:none; }
        .content { grid-template-rows: 136px minmax(0, 1fr); gap: 6px; }
        .poi { min-width: 52px; min-height: 29px; padding: 4px; font-size: 9px; }
        .poi:nth-of-type(1) { left: 4%; top: 8%; }
        .poi:nth-of-type(2) { left: 36%; top: 30%; }
        .poi:nth-of-type(3) { left: 70%; top: 7%; }
        .poi:nth-of-type(4) { left: 15%; top: 66%; }
        .poi:nth-of-type(5) { left: 63%; top: 66%; }
        .frame[data-page="1"] .poi:nth-of-type(n + 4) { display:none; }
        .frame[data-page="2"] .poi:nth-of-type(-n + 3) { display:none; }
        .more-pois { display:block; position:absolute; z-index:2; right:6px; bottom:6px; min-width:62px; min-height:28px; padding:4px 6px; border:1px solid #8bb8a6; border-radius:6px; background:#fff; color:#185f47; font-size:9px; font-weight:700; cursor:pointer; }
        .detail { min-height: 0; padding: 7px 10px; }
        .detail h2 { margin: 3px 0; font-size: 14px; }
        .detail p { margin: 0; font-size: 9px; line-height: 1.35; }
        .status { display: none; }
      }
    </style>
  </head>
  <body>
    <main class="frame no-scroll-frame" data-dudesign-template="scenic-map-poi" data-dudesign-core-title="true" data-page="1">
      <header><p class="eyebrow">景点分布</p><h1>【景区主题】</h1><p class="summary">【一句话说明空间结构与核心看点；本图是交互示意，不冒充真实地图或精确导航。】</p></header>
      <nav class="tabs" role="tablist" aria-label="地图信息"><button class="tab" role="tab" aria-selected="true">景点分布</button><button class="tab" role="tab" aria-selected="false">路线串联</button><button class="tab" role="tab" aria-selected="false">游览提示</button></nav>
      <section class="content">
        <div class="map" aria-label="景点位置示意">
          <button class="poi" aria-pressed="true" data-title="【核心景点甲】" data-copy="【说明景点价值、区域位置与资料来源状态。】">景点甲<small>核心区</small></button>
          <button class="poi" aria-pressed="false" data-title="【景点乙】" data-copy="【说明它与核心景点的路线或空间关系。】">景点乙<small>连接点</small></button>
          <button class="poi" aria-pressed="false" data-title="【景点丙】" data-copy="【说明已提供的看点；没有坐标时明确位置待确认。】">景点丙<small>北侧</small></button>
          <button class="poi" aria-pressed="false" data-title="【景点丁】" data-copy="【说明适合何种探索顺序，不提供虚构实时状态。】">景点丁<small>入口侧</small></button>
          <button class="poi" aria-pressed="false" data-title="【景点戊】" data-copy="【说明返程或串联关系，不接入外部导航。】">景点戊<small>出口侧</small></button>
          <button class="more-pois" type="button">更多点位 <span id="poiPage">1/2</span></button>
        </div>
        <article class="detail" aria-live="polite"><span class="detail-label">当前 POI</span><h2 id="poiTitle">【核心景点甲】</h2><p id="poiCopy">【说明景点价值、区域位置与资料来源状态。】</p><div class="status">坐标状态：【已提供 / 近似 / 待确认】</div></article>
      </section>
    </main>
    <script data-dudesign-example-interaction>
      document.querySelectorAll('.poi').forEach((poi) => poi.addEventListener('click', () => {
        document.querySelectorAll('.poi').forEach((item) => item.setAttribute('aria-pressed', 'false'));
        poi.setAttribute('aria-pressed', 'true');
        document.querySelector('#poiTitle').textContent = poi.dataset.title;
        document.querySelector('#poiCopy').textContent = poi.dataset.copy;
      }));
      document.querySelectorAll('.tab').forEach((tab) => tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((item) => item.setAttribute('aria-selected', 'false'));
        tab.setAttribute('aria-selected', 'true');
      }));
      document.querySelector('.more-pois').addEventListener('click', () => {
        const frame = document.querySelector('.frame');
        const nextPage = frame.dataset.page === '1' ? '2' : '1';
        frame.dataset.page = nextPage;
        document.querySelector('.more-pois').firstChild.textContent = nextPage === '1' ? '更多点位 ' : '返回点位 ';
        document.querySelector('#poiPage').textContent = `${nextPage}/2`;
      });
    </script>
  </body>
</html>
