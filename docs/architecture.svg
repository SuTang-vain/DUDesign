<svg width="900" height="480" viewBox="0 0 900 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DUDesign four-layer architecture">
  <defs>
    <linearGradient id="gradPath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6487FA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Courier New', ui-monospace, monospace; }
      .layer { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; fill: #9A9DA8; }
      .box-title { font-size: 14.5px; font-weight: 600; fill: #23252B; }
      .box-sub { font-size: 11px; fill: #83868F; }
    </style>
  </defs>
  <rect width="900" height="480" fill="#FAF9F6"/>

  <!-- layer 1: user experience -->
  <text x="40" y="30" class="mono layer">USER EXPERIENCE</text>
  <rect x="40" y="44" width="380" height="74" rx="11" fill="#FFFFFF" stroke="#E6E3DC"/>
  <text x="60" y="70" class="sans box-title">Web app</text>
  <text x="60" y="90" class="sans box-sub">Design workspace · variation wall · editor</text>
  <text x="60" y="106" class="sans box-sub">Refinement &amp; annotation · share links</text>
  <rect x="452" y="44" width="380" height="74" rx="11" fill="#FFFFFF" stroke="#E6E3DC"/>
  <text x="472" y="70" class="sans box-title">Admin console</text>
  <text x="472" y="90" class="sans box-sub">Capability governance · template library</text>
  <text x="472" y="106" class="sans box-sub">Runtime health · usage &amp; audit</text>

  <!-- layer 2: application service -->
  <text x="40" y="150" class="mono layer">APPLICATION SERVICE</text>
  <rect x="40" y="164" width="792" height="74" rx="11" fill="#FFFFFF" stroke="url(#gradPath)" stroke-width="1.5"/>
  <rect x="60" y="180" width="34" height="4" rx="2" fill="url(#gradPath)"/>
  <text x="60" y="208" class="sans box-title">DUDesign API</text>
  <text x="60" y="226" class="sans box-sub">Sessions · jobs · variations · artifacts · shares · permissions · automation loops</text>

  <!-- layer 3: runtime compatibility -->
  <text x="40" y="270" class="mono layer">RUNTIME COMPATIBILITY</text>
  <rect x="40" y="284" width="380" height="74" rx="11" fill="#EDF1FE" stroke="#CBD7FB"/>
  <text x="60" y="310" class="sans box-title" style="fill:#4A6EE0">Runtime gateway</text>
  <text x="60" y="330" class="sans box-sub" style="fill:#5A6FB8">Stable DUDesign contracts only</text>
  <text x="60" y="346" class="sans box-sub" style="fill:#5A6FB8">BabeL-O protocol lives only here</text>
  <rect x="452" y="284" width="380" height="74" rx="11" fill="#FFFFFF" stroke="#E6E3DC"/>
  <text x="472" y="310" class="sans box-title">Runtime adapter</text>
  <text x="472" y="330" class="sans box-sub">Lane scheduling · retries · timeouts</text>
  <text x="472" y="346" class="sans box-sub">Event bridging · execution watchdog</text>

  <!-- layer 4: BabeL-O runtime kernel -->
  <text x="40" y="392" class="mono layer">BABEL-O RUNTIME KERNEL (EXTERNAL)</text>
  <rect x="40" y="406" width="792" height="60" rx="11" fill="#FFFFFF" stroke="#E6E3DC" stroke-dasharray="5 4"/>
  <text x="60" y="432" class="sans box-title">BabeL-O nexus</text>
  <text x="60" y="450" class="sans box-sub">Agent loop · tool execution · session resume · memory retrieval</text>

  <!-- arrows: web -> api -->
  <line x1="230" y1="118" x2="230" y2="160" stroke="#C9CDD8" stroke-width="1.2"/>
  <polygon points="230,164 226,154 234,154" fill="#C9CDD8"/>
  <line x1="642" y1="118" x2="642" y2="160" stroke="#C9CDD8" stroke-width="1.2"/>
  <polygon points="642,164 638,154 646,154" fill="#C9CDD8"/>
  <!-- api -> gateway -->
  <line x1="230" y1="238" x2="230" y2="280" stroke="#C9CDD8" stroke-width="1.2"/>
  <polygon points="230,284 226,274 234,274" fill="#C9CDD8"/>
  <!-- gateway -> runtime -->
  <line x1="230" y1="358" x2="230" y2="402" stroke="#C9CDD8" stroke-width="1.2"/>
  <polygon points="230,406 226,396 234,396" fill="#C9CDD8"/>
  <text x="242" y="390" class="sans" font-size="11" fill="#83868F">Gateway is the only layer that understands BabeL-O protocol details</text>
</svg>
