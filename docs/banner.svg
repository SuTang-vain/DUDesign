<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DUDesign banner — AI front-end design platform">
  <defs>
    <linearGradient id="gradAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6487FA"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#23252B" opacity="0.05"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SF Mono', 'Courier New', ui-monospace, monospace; }
      .chip { font-size: 12.5px; font-weight: 500; fill: #5A5E6B; }
    </style>
  </defs>
  <rect width="1200" height="300" fill="#FAF9F6"/>
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- logo mark: rounded square with gradient node + page-frame motif -->
  <g transform="translate(80 96)">
    <rect width="52" height="52" rx="13" fill="#FFFFFF" stroke="#E3E1DB"/>
    <circle cx="26" cy="26" r="8" fill="url(#gradAccent)"/>
    <rect x="14" y="13" width="10" height="7" rx="1.5" fill="#FFFFFF" stroke="#C2A36B" stroke-width="1.3"/>
    <rect x="28" y="13" width="10" height="7" rx="1.5" fill="#FFFFFF" stroke="#6FA586" stroke-width="1.3"/>
    <rect x="14" y="35" width="10" height="7" rx="1.5" fill="#FFFFFF" stroke="#D98B8B" stroke-width="1.3"/>
    <rect x="28" y="35" width="10" height="7" rx="1.5" fill="#FFFFFF" stroke="#8FA3E8" stroke-width="1.3"/>
  </g>

  <text x="152" y="124" class="sans" font-size="46" font-weight="700" letter-spacing="-1.2" fill="#23252B">DUDesign</text>
  <text x="153" y="158" class="sans" font-size="17" fill="#83868F">Describe it. Generate variations. Refine. Ship.</text>

  <!-- feature chips -->
  <g class="sans">
    <rect x="152" y="184" width="128" height="28" rx="14" fill="#FFFFFF" stroke="#E3E1DB"/>
    <text x="168" y="202" class="chip">Prompt → HTML</text>
    <rect x="292" y="184" width="150" height="28" rx="14" fill="#FFFFFF" stroke="#E3E1DB"/>
    <text x="308" y="202" class="chip">Parallel variations</text>
    <rect x="454" y="184" width="132" height="28" rx="14" fill="#EDF1FE" stroke="#CBD7FB"/>
    <text x="470" y="202" class="chip" style="fill:#4A6EE0">Refine &amp; annotate</text>
    <rect x="598" y="184" width="110" height="28" rx="14" fill="#FFFFFF" stroke="#E3E1DB"/>
    <text x="614" y="202" class="chip">Export &amp; share</text>
  </g>
  <text x="153" y="244" class="mono" font-size="11.5" letter-spacing="1.5" fill="#83868F">HOSTED · PROMPT-DRIVEN · RUNTIME-GATEWAYED</text>

  <!-- RIGHT-SIDE PROJECT MOTIF: master page frame + parallel variation frames -->
  <g>
    <!-- master frame -->
    <rect x="858" y="78" width="210" height="140" rx="10" fill="#FFFFFF" stroke="url(#gradAccent)" stroke-width="1.6"/>
    <rect x="874" y="96" width="120" height="9" rx="4.5" fill="url(#gradAccent)" opacity="0.9"/>
    <rect x="874" y="114" width="92" height="5" rx="2.5" fill="#C9CDD8"/>
    <rect x="874" y="128" width="150" height="5" rx="2.5" fill="#C9CDD8"/>
    <rect x="874" y="142" width="132" height="5" rx="2.5" fill="#C9CDD8"/>
    <rect x="874" y="164" width="78" height="24" rx="12" fill="#EDF1FE" stroke="#CBD7FB"/>
    <text x="890" y="180" class="mono" font-size="10" style="fill:#4A6EE0">PROMPT</text>
    <!-- connection lines from master to variants -->
    <line x1="930" y1="218" x2="930" y2="238" stroke="#C9CDD8" stroke-width="1.2"/>
    <line x1="930" y1="238" x2="852" y2="238" stroke="#C9CDD8" stroke-width="1.2"/>
    <line x1="930" y1="238" x2="1008" y2="238" stroke="#C9CDD8" stroke-width="1.2"/>
    <!-- variant frames -->
    <rect x="780" y="242" width="64" height="42" rx="7" fill="#FFFFFF" stroke="#6FA586" stroke-width="1.4"/>
    <rect x="792" y="252" width="40" height="4" rx="2" fill="#6FA586" opacity="0.65"/>
    <rect x="792" y="262" width="30" height="3" rx="1.5" fill="#C9CDD8"/>
    <rect x="924" y="242" width="64" height="42" rx="7" fill="#FFFFFF" stroke="#C2A36B" stroke-width="1.4"/>
    <rect x="936" y="252" width="40" height="4" rx="2" fill="#C2A36B" opacity="0.65"/>
    <rect x="936" y="262" width="30" height="3" rx="1.5" fill="#C9CDD8"/>
    <rect x="1068" y="242" width="64" height="42" rx="7" fill="#FFFFFF" stroke="#8FA3E8" stroke-width="1.4"/>
    <rect x="1080" y="252" width="40" height="4" rx="2" fill="#8FA3E8" opacity="0.65"/>
    <rect x="1080" y="262" width="30" height="3" rx="1.5" fill="#C9CDD8"/>
  </g>

  <line x1="80" y1="274" x2="1120" y2="274" stroke="#E3E1DB"/>
  <text x="80" y="290" class="mono" font-size="10" letter-spacing="1" fill="#83868F">DESIGN-GENERATION PIPELINE · BabeL-O RUNTIME COMPATIBILITY LAYER</text>
  <text x="1120" y="290" text-anchor="end" class="mono" font-size="10" letter-spacing="1" fill="#83868F">v0.1.0</text>
</svg>
